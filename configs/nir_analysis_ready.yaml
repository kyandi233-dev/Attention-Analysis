pipeline:
  name: attention-analysis-nir-analysis-ready-pupil-only
  version: 2.0.0
  schema_version: 2
  signal_semantics: pupil_geometry_only
  timezone: Asia/Shanghai

# These are three different hierarchy/counting axes. They must never be reported
# as one participant count or treated as evidence of measurement validity.
cohort_topology:
  sessions: 44
  analysis_groups: 38
  double_session_repeat_groups: 6

paths:
  # Site-local, read-only manifest. Do not commit the real manifest: it contains
  # local source locations and anonymous analysis-group tokens used for leakage-safe
  # grouping. Override this path in a local config when needed.
  source_manifest: "../Attention-Analysis-local/nir_topology_pupil_only.json"
  # Portable derived default; production runs may use --output-root.
  output_root: "../Attention-Analysis-local/nir-behavior-v2/10_analysis_ready"

source_contract:
  accepted_eye_metrics_schemas: [6, 7]
  eye_mapping:
    frame_left: left
    frame_right: right
  required_pupil_geometry:
    - pupil_found
    - pupil_fit_valid
    - pupil_center_x
    - pupil_center_y
    - pupil_geom_mean_diameter
  retained_segmentation_proportions:
    - hard_pupil_fraction
    - soft_pupil_fraction
    - hard_iris_fraction
    - soft_iris_fraction
  # Iris fractions are retained only as segmentation proportions. They are not
  # an iris diameter and can never authorize PIR/OAR reconstruction.
  forbidden_derived_metrics:
    - PIR
    - OAR
    - pupil_to_iris_ratio
    - fullclass_pupil_to_iris_diameter_ratio
    - fullclass_ocular_aperture_ratio_median
    - fullclass_ocular_aperture_ratio_p90

quality_tracks:
  primary: "observed + RITnet success + positive finite fitted pupil geometry; interpolation-only excluded"
  strict_sensitivity: "primary + no ROI clipping/padding-edge pupil + no temporal anomaly"
  separate_failure_axes:
    - source_missing
    - ritnet_missing
    - roi_clipped
    - geometry_invalid
    - temporal_flagged
    - interpolation_only

standardization:
  primary: "session_eye_median_centered_across_block1_block2"
  robust_z_scale: 1.4826
  repeat_sessions_share_baseline: false
  rationale: "repeat sessions remain separate to avoid cross-session leakage"

binocular:
  base_layer_input: "centered_pupil_diameter"
  both_valid: equal_weight_mean
  single_eye_fallback: true
  preserve_left_right_tracks: true

analysis_policy:
  enforce_expected_topology: true
  production_read_only: true
  max_eye_time_delta_ms: 1.0
  auto_exclude_sessions: false
  auto_exclude_eyes: false
  auto_exclude_blocks: false
  choose_quality_threshold_from_outcome: false
  choose_window_from_outcome: false
  run_formal_statistics: false
  interpretation_boundary: "engineering and analysis-readiness only"
