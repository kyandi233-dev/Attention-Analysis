pipeline:
  name: attention-analysis-nir-analysis-ready-pupil-only
  version: 2.4.0
  schema_version: 4
  signal_semantics: pupil_geometry_plus_ocular_aperture_qc
  timezone: Asia/Shanghai

cohort_topology:
  sessions: 116
  analysis_groups: 61
  double_session_repeat_groups: 10

paths:
  # JSON source-availability manifest consumed by the staged pupil-only materializer.
  source_manifest: "@path:nir_analysis_ready_source_manifest_json"
  output_root: "@path:nir_analysis_ready_root"

source_contract:
  manifest_format: json_object_with_sessions
  accepted_eye_metrics_schemas: [6, 7]
  availability_accounting: available_sessions_plus_unavailable_sessions_equals_canonical_cohort
  canonical_cohort_source: "@path:cohort_manifest"
  missing_nir_never_redefines_cohort: true
  eye_mapping:
    frame_left: left
    frame_right: right
  required_pupil_geometry:
    - pupil_found
    - pupil_fit_valid
    - pupil_center_x
    - pupil_center_y
    - pupil_geom_mean_diameter
  retained_segmentation_proportions:
    - hard_pupil_fraction
    - soft_pupil_fraction
    - hard_iris_fraction
    - soft_iris_fraction
  retained_ocular_aperture_qc:
    fields:
      - fullclass_ocular_aperture_ratio_median
      - fullclass_ocular_aperture_ratio_p90
    preferred_summary: fullclass_ocular_aperture_ratio_median
    role: nir_eye_opening_candidate_qc
    derivation: visible_ocular_mask_height_over_width
    producer_derived_only: true
    do_not_reconstruct_from_iris_fraction: true
    not_ear: true
    not_blink_event: true
    not_perclos: true
  forbidden_derived_metrics:
    - PIR
    - OAR
    - pupil_to_iris_ratio
    - fullclass_pupil_to_iris_diameter_ratio

quality_tracks:
  primary: "observed + RITnet success + positive finite fitted pupil geometry; interpolation-only excluded"
  strict_sensitivity: "primary + no ROI clipping/padding-edge pupil + no temporal anomaly"
  separate_failure_axes:
    - source_missing
    - ritnet_missing
    - roi_clipped
    - geometry_invalid
    - temporal_flagged
    - interpolation_only

standardization:
  per_session_per_eye: true
  baseline_statistic: median
  baseline_spread: MAD
  robust_z_scale: 1.4826
  preserve_raw_diameter: true
  preserve_centered_diameter: true
  preserve_robust_z: true

binocular:
  primary_rule: mean_when_both_valid_else_valid_eye
  strict_rule: mean_when_both_strict_else_strict_eye
  preserve_source_mode: true

sessions:
  include: []

analysis_policy:
  formal_cluster_key: participant_group_id
  analysis_group_token_is_nir_compatibility_alias: true
  # The authoritative wrapper validates 116/61/10 against cohort_manifest and
  # validates NIR availability separately. The low-level materializer therefore
  # must not mistake the 109 available source records for the full cohort.
  enforce_expected_topology: false
  production_nir_read_directly: false
  rerun_yolo_allowed: false
  rerun_ritnet_allowed: false
  pir_or_iris_geometry_reconstruction_allowed: false
  ocular_aperture_qc_preserved_from_producer: true
  ocular_aperture_is_formal_blink_or_perclos: false
  endpoint_freeze: pending_real_data_scientific_review
  machine_absolute_paths_allowed_in_science_config: false
