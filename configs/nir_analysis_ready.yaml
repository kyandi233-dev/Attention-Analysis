pipeline:
  name: attention-analysis-nir-analysis-ready
  version: 1.0.0
  schema_version: 1
  cohort_label: cohort-44-exploratory
  timezone: Asia/Shanghai

paths:
  # Frozen production discovery/alignment contract. Read-only input.
  alignment_config: "configs/nir_behavior_alignment.yaml"
  # Analysis-ready derived data live outside production and existing QC layers.
  output_root: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v2/cohort-44-exploratory/10_analysis_ready"

subjects:
  # Empty means: discover every completed production full-class subject through
  # the frozen alignment source roots. For the current snapshot this should be 44.
  include: []

materialization:
  formal_phases: ["block1", "block2"]
  # Left/right rows sharing subject+phase+phase_segment+frame_idx should describe
  # the same timepoint. Larger discrepancies are treated as a contract error.
  max_eye_time_delta_ms: 1.0

validity:
  # Primary frame rule frozen by docs/020-nir/212-*.md.
  primary:
    require_pupil_fit_valid: true
    require_iris_outer_fit_valid: true
    require_pupil_center_in_iris_outer: true
    require_iris_larger_than_pupil: true
    require_pir_finite: true
    require_pupil_whole_mask_not_edge: false
    require_iris_whole_mask_not_edge: false
    require_roi_not_clipped: false
  # Historical production rule retained only as strict sensitivity.
  strict:
    require_fullclass_normalization_valid: true
    require_pir_finite: true

standardization:
  primary: "subject_eye_median_centered_across_formal_blocks"
  robust_z_scale: 1.4826
  block_centering_primary: false

binocular:
  # Base analysis-ready layer fuses only after per-eye baseline adjustment.
  # Coverage and binocular-concordance gates belong to later analysis windows.
  base_layer_input: "primary_centered_pir"
  both_valid: "equal_weight_mean"
  single_eye_fallback: true
  apply_window_coverage_gate: false
  apply_binocular_concordance_gate: false

provenance:
  # Completion markers are always hashed. Full source CSV hashing roughly doubles
  # I/O on multi-million-row data, so it is optional for routine re-materialization.
  hash_source_csv: false

reporting:
  known_low_usable_subjects:
    - sub-035
    - sub-036
    - sub-047
    - sub-050
    - sub-150
    - sub-153
    - sub-163
    - sub-165
    - sub-171
    - sub-176

analysis_policy:
  exploratory_cohort_only: true
  production_read_only: true
  auto_exclude_subjects: false
  auto_exclude_eyes: false
  auto_exclude_blocks: false
  choose_coverage_from_outcome: false
  choose_window_from_outcome: false
  run_formal_statistics: false
