# Copy to configs/paths.local.yaml (gitignored), or place an equivalent registry
# elsewhere and set ATTENTION_ANALYSIS_PATHS_CONFIG to its path.
# This is the ONLY machine-specific path file. Replace ${...} values locally;
# never commit D:/ E:/ F:/ J:/ or another computer's absolute paths into science configs.

version: 3

paths:
  formal_raw_roots:
    - "${FOCUSWAVE_FORMAL_RAW_ROOT}"
  cohort_manifest: "${FOCUSWAVE_COHORT_MANIFEST}"
  repeat_registry: "${FOCUSWAVE_REPEAT_REGISTRY}"
  questionnaire_derived_data: "${FOCUSWAVE_QUESTIONNAIRE_DERIVED_DATA}"

  # Authoritative staged NIR pupil-only materializer manifest. JSON object with sessions[].
  nir_analysis_ready_source_manifest_json: "${FOCUSWAVE_NIR_ANALYSIS_READY_SOURCE_MANIFEST_JSON}"
  # Legacy CSV manifest consumed only by scripts/formal_multimodal_analysis.py nir-adapt.
  # It is not the authoritative 10_analysis_ready input and must not share the JSON path.
  nir_source_manifest: "${FOCUSWAVE_NIR_ADAPTER_SOURCE_MANIFEST_CSV_LEGACY}"
  nir_standardized_root: "${FOCUSWAVE_NIR_STANDARDIZED_ROOT}"
  nir_analysis_ready_root: "${FOCUSWAVE_NIR_ANALYSIS_READY_ROOT}"
  nir_analysis_tables_root: "${FOCUSWAVE_NIR_ANALYSIS_TABLES_ROOT}"
  nir_pipeline_validation_root: "${FOCUSWAVE_NIR_PIPELINE_VALIDATION_ROOT}"
  stimulus_visual_properties: "${FOCUSWAVE_STIMULUS_VISUAL_PROPERTIES}"

  rgb_raw_output_root: "${FOCUSWAVE_RGB_RAW_OUTPUT_ROOT}"
  rgb_analysis_ready_root: "${FOCUSWAVE_RGB_ANALYSIS_READY_ROOT}"
  rgb_analysis_tables_root: "${FOCUSWAVE_RGB_ANALYSIS_TABLES_ROOT}"

  behavior_output_root: "${FOCUSWAVE_BEHAVIOR_OUTPUT_ROOT}"
  rgb_output_root: "${FOCUSWAVE_RGB_OUTPUT_ROOT}"
  mmwave_output_root: "${FOCUSWAVE_MMWAVE_OUTPUT_ROOT}"
  fusion_output_root: "${FOCUSWAVE_FUSION_OUTPUT_ROOT}"
