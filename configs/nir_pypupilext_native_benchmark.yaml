pipeline:
  name: attention-analysis-nir-pypupilext-native-benchmark
  version: 0.2.1
  schema_version: 1

paths:
  alignment_config: "configs/nir_behavior_alignment.yaml"
  raw_data_roots:
    - "E:/正式实验"
    - "F:/正式实验"
    - "E:/Data"
    - "F:/Data"
  output_root: "D:/_AttentionData/Beijing-NIR/analysis/pypupilext-native-benchmark/sub031-040"

subjects:
  include:
    - sub-031
    - sub-032
    - sub-033
    - sub-034
    - sub-035
    - sub-036
    - sub-037
    - sub-038
    - sub-039
    - sub-040

algorithms:
  include:
    - ElSe
    - ExCuSe
    - Swirski2D
  module_candidates:
    - pypupilext
    - pypupil
    - PyPupilEXT
  method_preference:
    - runWithConfidence
    - run

sampling:
  # Per subject. Sampling is decided before any pupil detector runs.
  block_uniform_n: 300
  temporal_n: 300
  temporal_preferred_phase: block1
  manual_qc_n: 12

smoke:
  block_uniform_n: 5
  temporal_n: 30
  manual_qc_n: 2

input:
  frame_index_base: 0
  min_crop_width: 20
  min_crop_height: 12
  grayscale: true
  # Keep the existing YOLO eye box in source-video pixels. Do not resize the
  # crop before ElSe / ExCuSe / Swirski2D.
  resize_native_crop: false

# Only frame identity and the existing YOLO tight-eye box are consumed from
# production outputs. No RITnet mask, geometry, validity or confidence field is
# used by this benchmark.
columns:
  phase:
    aliases: [phase]
  frame_idx:
    aliases: [frame_idx, video_frame_position]
  eye:
    aliases: [eye]
  tight_bbox_x1:
    aliases: [eye_bbox_x1, bbox_x1, yolo_bbox_x1, yolo_x1, detection_x1, det_x1]
  tight_bbox_y1:
    aliases: [eye_bbox_y1, bbox_y1, yolo_bbox_y1, yolo_y1, detection_y1, det_y1]
  tight_bbox_x2:
    aliases: [eye_bbox_x2, bbox_x2, yolo_bbox_x2, yolo_x2, detection_x2, det_x2]
  tight_bbox_y2:
    aliases: [eye_bbox_y2, bbox_y2, yolo_bbox_y2, yolo_y2, detection_y2, det_y2]

analysis_policy:
  rerun_yolo: false
  run_neural_pupil_model: false
  use_ritnet_outputs: false
  resize_native_crop: false
  returned_ellipse_equals_credible_pupil: false
  upload_subject_images: false
  upload_frame_level_outputs: false
