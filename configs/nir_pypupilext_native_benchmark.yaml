pipeline:
  name: attention-analysis-nir-pypupilext-native-benchmark
  version: 0.4.0
  schema_version: 2

# Runtime policy (docs/020-nir/030 section 3-4):
# - The main algorithm runtime MUST measure plain run() only.
# - runWithConfidence() / outline confidence is an OPTIONAL separate pass whose
#   extra time is recorded independently in confidence_runtime_ms. It never
#   contributes to runtime_ms.
runtime:
  main_method: run
  confidence: separate_optional

paths:
  # This benchmark consumes frozen production evidence from this exact root.
  # The source video is resolved from completion.json / eyes.csv and must exist;
  # it is never inferred by concatenating a raw-data directory name.
  production_root: "D:/_AttentionData/Beijing-NIR/amd-directml"
  output_root: "D:/_AttentionData/Beijing-NIR/analysis/pypupilext-native-benchmark/sub031-040"

production:
  required_completion_status: complete
  prefer_run_name_contains: "yolo-b8_ritnet-b16"
  required_files: [completion.json, eyes.csv, run_manifest.json]
  ritnet_analysis_size: [320, 160]
  hash_evidence_files: true
  # Full source-video SHA256 is intentionally off because the multi-GB videos
  # are immutable upstream data and hashing all ten is a separate I/O cost.
  # File size and nanosecond mtime are always recorded instead.
  hash_source_video: false

subjects:
  include:
    - sub-031
    - sub-032
    - sub-033
    - sub-034
    - sub-035
    - sub-036
    - sub-037
    - sub-038
    - sub-039
    - sub-040

algorithms:
  # Seven classical algorithms (six from PyPupilEXT + Pupil Labs 2D standalone).
  include:
    - PuRe
    - PuReST
    - PupilLabs2D
    - ElSe
    - ExCuSe
    - Swirski2D
    - Starburst
  module_candidates:
    pypupilext: [pypupilext, pypupilext, PyPupilEXT]
    pupil_labs_2d: [pupil_detectors]
  # RITnet is a comparator/reference only (already-computed production output),
  # never re-run by this benchmark.
  ritnet:
    role: comparator_only
    use_production_outputs: true

sampling:
  # Per subject. Sampling is decided before any pupil detector runs.
  block_uniform_n: 300
  ritnet_high_quality_n: 100
  ritnet_difficult_n: 100
  temporal_n: 300
  temporal_preferred_phase: block1
  manual_qc_n: 12

smoke:
  block_uniform_n: 3
  ritnet_high_quality_n: 2
  ritnet_difficult_n: 2
  temporal_n: 5
  manual_qc_n: 2

input:
  frame_index_base: 0
  min_crop_width: 20
  min_crop_height: 12
  grayscale: true
  # Keep the existing YOLO eye box in source-video pixels. Do not resize the
  # crop before any algorithm. Per-algorithm INTERNAL resize/downscale is an
  # official behavior recorded in provenance (docs/020-nir/030 section 4); the
  # benchmark itself never resizes.
  resize_native_crop: false
  bbox_rounding: floor_min_ceil_max
  tight_input_kind: production_tight_bbox
  continuous_input_kind: fixed_source_canvas_from_temporal_tight_bbox_union
  continuous_canvas_padding_px: 0

# Scale rule for resolution-sensitive parameters (docs/020-nir/030 section 6):
# frozen from the ~424x187 tight crop probe; provenance recorded in output.
scale_rule:
  radius_min_fraction: 0.02
  radius_max_fraction: 0.10
  swirski_ransac_seed: 0
  source_probe: "sub-031 frame 46988 tight crop ~424x187, RITnet pupil ~6-16px diameter"

# Only frame identity and the existing YOLO tight-eye box are consumed from
# production outputs. No RITnet mask, geometry, validity or confidence field is
# used to gate the classical algorithms; RITnet is agreement-only.
columns:
  phase:
    aliases: [phase]
  frame_idx:
    aliases: [frame_idx, video_frame_position]
  eye:
    aliases: [eye]
  tight_bbox_x1:
    aliases: [eye_bbox_x1, bbox_x1, yolo_bbox_x1, yolo_x1, detection_x1, det_x1]
  tight_bbox_y1:
    aliases: [eye_bbox_y1, bbox_y1, yolo_bbox_y1, yolo_y1, detection_y1, det_y1]
  tight_bbox_x2:
    aliases: [eye_bbox_x2, bbox_x2, yolo_bbox_x2, yolo_x2, detection_x2, det_x2]
  tight_bbox_y2:
    aliases: [eye_bbox_y2, bbox_y2, yolo_bbox_y2, yolo_y2, detection_y2, det_y2]

analysis_policy:
  rerun_yolo: false
  run_neural_pupil_model: false
  use_ritnet_outputs: false
  resize_native_crop: false
  returned_ellipse_equals_credible_pupil: false
  upload_subject_images: false
  upload_frame_level_outputs: false
  ritnet_is_ground_truth: false
  agreement_not_accuracy: true
  select_samples_before_algorithms: true
  require_fixed_canvas_for_stateful_continuous_mode: true

integrity:
  fail_on_multiple_complete_runs: true
  fail_on_insufficient_samples: true
  fail_on_duplicate_evidence_key: true
  fail_on_existing_output: true
  atomic_tabular_writes: true
