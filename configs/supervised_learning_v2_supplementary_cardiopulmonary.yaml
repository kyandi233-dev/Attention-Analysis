    model IDs declared by the current B-layer comparison-specific analysis_set_id; unrelated feature,
    scientific-modality, or device-package models are not forced onto one global common sample. Legacy
    modality_blocks is compatibility-only and must not carry nir/rgb/mmwave as scientific modalities.
