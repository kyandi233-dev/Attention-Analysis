      only, with the same qualification boundary as the heart-rate entry.
  note: Each exact representation records feature_id/scientific_feature_id, scientific modality, optional
    feature_type, predictor column(s), Behavior/sensor role, raw source, explicit source_namespace, actual
    required_devices, preprocessing_dependencies, temporal_anchor, temporal_scope, time_legality_status,
    time_legality_evidence, standalone / Behavior+x / modality-model / Full eligibility, and explicit
    M0-M7 device-package eligibility. Scientific modality, producer namespace, hardware dependency, and
    temporal legality are independent fields. Every feature requesting formal prediction eligibility is
    verified_pre_probe_only, and every time_legality_evidence string is copied verbatim from the frozen
    producer handoff.
  supplementary_extension:
    declared_at: '2026-09-13'
    scientific_modality: cardiopulmonary
    feature_ids:
    - cardiopulmonary.hr.fused.v1
    - cardiopulmonary.br.v1
    purpose: Let the report answer whether millimetre-wave cardiopulmonary estimates add predictive information,
      without asserting a qualification they do not hold.
    why_not_formal: modality_model_eligible is simultaneously a prediction-eligibility request and is
      fail-closed for every status other than verified_pre_probe_only. Cardiopulmonary holds physiology_qualification=LIMITED_SUPPORTING_ONLY
      and time_legality_status=blocked_upstream_contract_mismatch, so registering it formally would require
      asserting verified_pre_probe_only, which is not true today.
    declaration: post_hoc_declared_after_primary_results_observed
    non_effects:
    - does not modify the frozen 11-feature registry or configs/supervised_learning_v1.yaml
    - grants no formal prediction eligibility and no device-package eligibility
    - does not change unavailable_modalities or unavailable_device_packages for the formal line
feature_schemes:
