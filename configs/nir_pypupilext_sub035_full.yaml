# Full-video benchmark profile for sub-035 only.
#
# Runs every block1+block2 frame of sub-035 through the seven classical
# detectors (tight, independent mode) plus one long continuous window for
# temporal stability. Full-video tight sampling is detector-outcome-independent
# and fixed before any algorithm runs.
pipeline:
  name: attention-analysis-nir-pypupilext-native-benchmark
  version: 0.4.0
  schema_version: 2

runtime:
  main_method: run
  confidence: separate_optional

paths:
  production_root: "D:/_AttentionData/Beijing-NIR/amd-directml"
  output_root: "D:/_AttentionData/Beijing-NIR/analysis/pypupilext-native-benchmark/sub035-full"

production:
  required_completion_status: complete
  prefer_run_name_contains: "yolo-b8_ritnet-b16"
  required_files: [completion.json, eyes.csv, run_manifest.json]
  ritnet_analysis_size: [320, 160]
  hash_evidence_files: true
  hash_source_video: false

subjects:
  include:
    - sub-035

algorithms:
  include:
    - PuRe
    - PuReST
    - PupilLabs2D
    - ElSe
    - ExCuSe
    - Swirski2D
    - Starburst
  ritnet:
    role: comparator_only
    use_production_outputs: true

sampling:
  # Full video: every block1+block2 frame is in the tight sample.
  full_video: true
  block_uniform_n: 0
  ritnet_high_quality_n: 0
  ritnet_difficult_n: 0
  # Longest available consecutive two-eye interval in sub-035 block1 is 1600
  # frames (~53 s); far more informative than the 300-frame default window.
  temporal_n: 1600
  temporal_preferred_phase: block1
  manual_qc_n: 12

input:
  frame_index_base: 0
  min_crop_width: 20
  min_crop_height: 12
  grayscale: true
  resize_native_crop: false
  bbox_rounding: floor_min_ceil_max
  tight_input_kind: production_tight_bbox
  continuous_input_kind: fixed_source_canvas_from_temporal_tight_bbox_union
  continuous_canvas_padding_px: 0

scale_rule:
  radius_min_fraction: 0.02
  radius_max_fraction: 0.10
  swirski_ransac_seed: 0
  source_probe: "sub-031 frame 46988 tight crop ~424x187, RITnet pupil ~6-16px diameter"

columns:
  phase:
    aliases: [phase]
  frame_idx:
    aliases: [frame_idx, video_frame_position]
  eye:
    aliases: [eye]
  tight_bbox_x1:
    aliases: [eye_bbox_x1, bbox_x1, yolo_bbox_x1, yolo_x1, detection_x1, det_x1]
  tight_bbox_y1:
    aliases: [eye_bbox_y1, bbox_y1, yolo_bbox_y1, yolo_y1, detection_y1, det_y1]
  tight_bbox_x2:
    aliases: [eye_bbox_x2, bbox_x2, yolo_bbox_x2, yolo_x2, detection_x2, det_x2]
  tight_bbox_y2:
    aliases: [eye_bbox_y2, bbox_y2, yolo_bbox_y2, yolo_y2, detection_y2, det_y2]

analysis_policy:
  rerun_yolo: false
  run_neural_pupil_model: false
  use_ritnet_outputs: false
  resize_native_crop: false
  returned_ellipse_equals_credible_pupil: false
  upload_subject_images: false
  upload_frame_level_outputs: false
  ritnet_is_ground_truth: false
  agreement_not_accuracy: true
  select_samples_before_algorithms: true
  require_fixed_canvas_for_stateful_continuous_mode: true

integrity:
  fail_on_multiple_complete_runs: true
  fail_on_insufficient_samples: true
  fail_on_duplicate_evidence_key: true
  fail_on_existing_output: true
  atomic_tabular_writes: true
