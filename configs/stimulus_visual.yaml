pipeline:
  name: attention-analysis-stimulus-visual
  version: "stimulus-visual-v1.2"

focuswave:
  repository: "kyandi233-dev/FocusWave"
  branch: "formaltest"
  sart_task_path: "01-MainProgram/core/sart_task.py"
  materials_subdir: "01-MainProgram/素材"

paths:
  # Prefer CLI --materials-dir. If omitted, the script also tries a sibling FocusWave checkout.
  materials_dir: null
  output_csv: "D:/Project/厚粲杯/11_数据/03_Attention-Analysis_nvidia-cuda_NIR-Behavior/stimulus_visual_properties.csv"
  manifest_json: "D:/Project/厚粲杯/11_数据/03_Attention-Analysis_nvidia-cuda_NIR-Behavior/stimulus_visual_manifest.json"
  rendered_images_dir: "D:/Project/厚粲杯/11_数据/03_Attention-Analysis_nvidia-cuda_NIR-Behavior/stimulus_visual_rendered"
  overview_full_png: "D:/Project/厚粲杯/11_数据/03_Attention-Analysis_nvidia-cuda_NIR-Behavior/stimulus_visual_overview_full.png"
  overview_central_png: "D:/Project/厚粲杯/11_数据/03_Attention-Analysis_nvidia-cuda_NIR-Behavior/stimulus_visual_overview_central.png"

render:
  display_profile: "beijing-formal-surface-pro"
  resolution_source: "focuswave_runtime_detected_screen_size"
  same_display_for_all_beijing_formal_subjects: true
  dpi_aware_runtime: true
  screen_width_px: 2880
  screen_height_px: 1920
  bg_fill_hex: "#C6BFAE"
  base_size_px: 412
  stimulus_position_px: [0, -20]
  stimulus_sizes_pct: [80, 100, 120]
  resize_filter: "nearest"
  fixed_central_roi_size_px: 600
  alpha_visible_threshold: 0.05

report_outputs:
  save_full_resolution_pngs: true
  overview_tile_width_px: 480

stimuli:
  go:
    - "01_mango.png"
    - "02_grape.png"
    - "03_avocado.png"
    - "04_bitter_melon.png"
    - "05_cucumber.png"
    - "06_kiwi.png"
    - "07_kale.png"
    - "08_lime.png"
  nogo:
    - "09_no_go.png"

references:
  background: "刺激.png"
  mask: "掩蔽刺激.png"

metrics:
  srgb_relative_luminance: true
  rms_contrast: true
  include_mask_delta: true
