pipeline:
  name: attention-analysis-stimulus-visual
  version: "stimulus-visual-v1.0"

focuswave:
  repository: "kyandi233-dev/FocusWave"
  branch: "formaltest"
  sart_task_path: "01-MainProgram/core/sart_task.py"
  materials_subdir: "01-MainProgram/素材"

paths:
  # Prefer CLI --materials-dir. If omitted, the script also tries a sibling FocusWave checkout.
  materials_dir: null
  output_csv: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v1/stimulus_visual_properties.csv"
  manifest_json: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v1/stimulus_visual_manifest.json"

render:
  # Formal Surface Pro task resolution. Override at CLI/config if a different monitor was used.
  screen_width_px: 2880
  screen_height_px: 1920
  bg_fill_hex: "#C6BFAE"
  base_size_px: 412
  stimulus_position_px: [0, -20]
  stimulus_sizes_pct: [80, 100, 120]
  resize_filter: "nearest"
  fixed_central_roi_size_px: 600
  alpha_visible_threshold: 0.05

stimuli:
  go:
    - "01_mango.png"
    - "02_grape.png"
    - "03_avocado.png"
    - "04_bitter_melon.png"
    - "05_cucumber.png"
    - "06_kiwi.png"
    - "07_kale.png"
    - "08_lime.png"
  nogo:
    - "09_no_go.png"

references:
  background: "刺激.png"
  mask: "掩蔽刺激.png"

metrics:
  # Digital relative-luminance metrics only; these are not physical cd/m^2 measurements.
  srgb_relative_luminance: true
  rms_contrast: true
  include_mask_delta: true
