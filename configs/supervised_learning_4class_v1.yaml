pipeline:
  name: focuswave-supervised-learning-4class-v1
  version: 1.0.0
  evidence_repo: kyandi233-dev/FocusWave-Formal-Analysis
  evidence_branch: codex/code-fix-ledger
  evidence_method_entry: 分析设计/1.16.24-Q1四分类正式分析与两条公平对照路线_20260913.md
  evidence_method_entry_supporting:
    - 分析设计/1.16.10-监督学习模态与设备定义修订及代码迁移计划_20260912.md
    - 分析设计/1.16.11-监督学习特征文件接口与运行前闸门_20260913.md
    - 分析设计/1.16.1-监督学习心理意义、训练权重与多层评价修订_20260911.md
  binary_mainline_config: configs/supervised_learning_v1.yaml
  frozen_invariants_copied_from_binary_mainline: true
  # 与二分类线共用同一随机种子，保证两条线的折内随机性口径一致。
  random_seed: 20260910

paths:
  input_table:
    path_key: supervised_learning_input_probe_table
  output_root:
    path_key: supervised_learning_output_root

# 四分类路线：A = 复用二分类线已冻结的比较特异特征方案；B = 外层训练折内前向逐步选择。
# 运行期可用 --route 覆盖；这里声明的值只作为缺省。
multiclass_route: A

task:
  name: q1_nominal_4class_multiclass
  analysis_unit: probe_preceding_window
  primary_window_seconds: 30
  source_column: q1_nominal_4class
  # 无序名义四类；保留原始整数值，不重映射到 0..3。
  classes: [1, 2, 3, 4]
  class_semantics: nominal_unordered
  # 标签编码 fail-closed：任何非缺失但不在 {1,2,3,4} 的取值直接报错；缺失保持缺失。
  fail_closed_encoding: true
  impute_missing_labels: false
  class_1_meaning: "completely focused on the sorting task"
  class_2_meaning: "attending to the experiment but not focused on the sorting task"
  class_3_meaning: "thinking about matters unrelated to the experiment"
  class_4_meaning: "mind blank, no definite thought"
  interpretation_boundary:
    - "the four classes are nominal and unordered; no ordinal attention-level score may be derived"
    - "classes 2/3/4 are the merged negative class in the binary line but are distinct here; they must not be summarized as one 'mind-wandering' construct"
    - "Q2 and the post-hoc questionnaire are never a predictor, label or stratification variable; Q2 is reporting context only"

validation:
  outer:
    method: leave_one_participant_out
    group_column: participant_group_id
    participant_disjoint: true
  inner:
    method: grouped_k_fold
    n_splits: 5
    group_column: participant_group_id
    refit_preprocessing_per_split: true
  zero_individual_calibration: true
  forbid_test_participant_sequence_statistics: true
  forbid_test_participant_future_information: true
  require_analysis_set_id: true

preprocessing:
  participant_equal_weighted_median_imputation_fit_on_training_only: true
  participant_equal_standardization_fit_on_training_only: true
  data_dependent_column_handling_fit_on_training_only: true
  participant_equal_training_weights_normalized_to_mean_one: true
  unified_global_coverage_cutoff: null
  participant_specific_within_between_mainline: false

