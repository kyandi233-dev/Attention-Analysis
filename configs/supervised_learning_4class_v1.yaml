# 四分类指标与判据（预注册 §4）。本节的数值与二分类线 uncertainty 节逐项相同，
# 因为它们来自同一份冻结的不确定性合同；主指标换成参与者宏平均多类对数损失。
models:
  primary:
    kind: logistic_l2
    multiclass_objective: multinomial
    # 与二分类完全同一网格，不得扩展。
    C_candidates: [0.01, 0.1, 1.0, 10.0]
    max_iter: 2000
  selection_metric: participant_macro_multiclass_log_loss
  selection_metric_note: "participant-equal macro average of per-probe multiclass log loss"
  route_b_forward_selection:
    enabled: true
    start_from_empty_set: true
    accept_rule: strict_improvement_only
    tie_break_order: [fewer_features, smaller_c, feature_id_lexicographic]
    empty_set_allowed: true
    empty_set_fallback: outer_training_fold_class_prior_constant
    unavailable_feature_rule: "a candidate feature whose column is unavailable in an outer training fold must never be selected and must be recorded in the fold audit"

uncertainty:
  participant_cluster_bootstrap:
    method: fixed_oof_participant_cluster_percentile
    replicates: 1000
    seed: 20260830
    confidence_level: 0.95
    paired_model_resampling: true
    retrain_within_bootstrap: false

# 四分类无信息基线（预注册 §4.3）：逐外层折的类别先验常数预测器。
# 参照值只作量级参照，实际判定必须逐折重算。
no_information_baseline:
  name: outer_fold_class_prior_constant
  uses_features: false
  reference_values_full_sample_scale_only:
    uniform_prior_ln4: 1.386294
    full_sample_class_prior_constant: 0.907631
    majority_class_1_constant: 0.372494

# Compatibility/manual-test interface. A non-empty feature_registry takes precedence.
# Structural leakage guards (Q1 outcome/output columns, IDs, raw locator/audit fields)
# live in feature_schemes.py; scientific eligibility belongs only to the registry.
feature_schemes:
  status: interface_only_pending_task_c_d
  model_families: {}
  participant_specific_suffixes_forbidden: [_within, _between]
  note: "Route A consumes the model IDs declared by the current B-layer comparison-specific analysis_set_id; route B ignores these families and uses the frozen registered feature pool."

outputs:
  preserve_probe_keys: true
  preserve_raw_q1: true
  preserve_four_class_probabilities: true
  preserve_predicted_class: true
  preserve_outer_fold: true
  preserve_feature_set_id: true
  preserve_analysis_set_id: true
  preserve_membership_type: true
  preserve_run_id: true
  preserve_route: true
  preserve_failures: true
  preserve_q2_for_reporting_context: true
  preserve_feature_comparison_plan: true
  preserve_scientific_modality: true
  preserve_source_namespace: true
  preserve_required_devices: true
  preserve_preprocessing_dependencies: true
  preserve_temporal_anchor: true
  preserve_temporal_scope: true
  preserve_time_legality_status: true
  preserve_time_legality_evidence: true
  preserve_comparison_role: true
  preserve_includes_behavior_reference: true
  paired_comparisons_require_same_analysis_set: true
  cross_analysis_set_increment_ranking_allowed: false
  binary_reporting_adapter_reused: true
  write_probe_trajectory: true
  write_session_discrimination: true
