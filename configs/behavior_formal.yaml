pipeline:
  name: attention-analysis-behavior-formal
  version: 1.0.0
  focuswave_release: "v3.1.3"
  timezone: Asia/Shanghai
  random_seed: 20260824

data:
  # NVIDIA RTX 5070 工作站当前正式数据根固定为 J:/Data。
  # Behavior 与 NIR 在该工作站使用同一根目录，避免跨机盘符配置互相污染。
  roots:
    - "J:/Data"
  min_subject_number: 31
  include: []
  exclude: []
  behavior_dir: "beh"

paths:
  # Formal research outputs must stay outside the Git working tree so branch
  # switches/pulls cannot touch previously generated analysis results.
  output_root: "D:/Project/厚粲杯/11_数据/02_Attention-Analysis_nvidia-cuda_formal_Behavior"

formal:
  expected_blocks: 2
  blocks:
    - number: 1
      condition: "B"
    - number: 2
      condition: "B"

validation:
  # Final v3.1.3 counts are inferred and checked for cross-subject consistency
  # until the task source / formal dataset audit freezes exact values here.
  expected_trials_per_block: null
  expected_nogo_per_block: null
  expected_probes_per_block: null
  require_cross_subject_count_consistency: true
  require_probe_position_consistency: false
  timestamp_tolerance_ms: 25

behavior:
  cycle_bins: 6
  rt_cv_min_n: 20
  rt_qc_ms:
    very_early: 100
    early: 150
    long: 1000
    beyond_nominal: 1150
  # Preserve raw probe codes. Final v3.1.3 label text must be verified
  # against the final task source before semantic labels are frozen.
  probe_preceding_go_trials: 8

stats:
  bootstrap_iterations: 20000
  seed: 20260824
  main_metrics:
    - commission_rate
    - omission_rate
    - dprime_loglinear
    - c
    - beta
    - go_rt_median_ms
    - rt_cv
    - exg_tau
