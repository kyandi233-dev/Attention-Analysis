pipeline:
  name: focuswave-behavior-supervised-candidates-v1
  version: 1.1.0
  authority: FocusWave-Formal-Analysis/analysis-design-1.16.4

source:
  table: behavior_supervised_probe_30s.csv
  analysis_unit: probe
  primary_window_seconds: 30
  one_row_per_probe: true

identity_and_locators:
  - participant_group_id
  - session_id
  - block_id
  - probe_event_id

outcomes:
  q1_nominal_4class:
    role: supervised_target_source
    downstream_task: q1_equals_1_vs_2_3_4
  q2_ordinal_4level:
    role: interpretation_construct_only
    first_round_predictor_allowed: false

candidate_dimensions:
  rt_level:
    columns: [go_correct_rt_mean_ms, go_correct_rt_median_ms]
    one_representative_per_feature_scheme: true
    final_choice: pending_q1_blind_measurement_review
  rt_variability:
    preferred_current: go_correct_rt_cv
    limited_alternatives: [go_correct_rt_sd_ms, go_correct_rt_mad_ms, go_correct_rt_iqr_ms]
    one_representative_per_feature_scheme: true
    final_choice: frozen_cv
    alternative_role: descriptive_sensitivity_only
  rt_trend:
    columns: [go_correct_rt_theilsen_slope_ms_per_s]
    final_choice: frozen_behavior_producer_definition
  omission:
    columns: [raw_go_omission_rate]
    final_choice: frozen_raw_only
  error_control:
    columns: [commission_rate, dprime_loglinear]
    primary: commission_rate
    alternative: dprime_loglinear
    final_choice: frozen_commission
    alternative_role: descriptive_sensitivity_only

descriptive_qc_sensitivity_only:
  - clean_go_omission_rate
  - timing_ambiguous_go_omission_rate
  - omission_prestimulus_only_ambiguity_rate
  - omission_carryover_only_ambiguity_rate
  - omission_prestimulus_and_carryover_ambiguity_rate
  - late_go_response_candidate_rate
  - anticipatory_go_response_candidate_rate

compatibility_aliases_not_independent_predictors:
  omission_rate: raw_go_omission_rate
  omission_no_detected_motor_timing_ambiguity_rate: clean_go_omission_rate
  omission_motor_timing_ambiguous_rate: timing_ambiguous_go_omission_rate

policies:
  no_imputation_in_task_c_interface: true
  no_row_deletion_by_feature_coverage_in_task_c: true
  no_full_cohort_empirical_redundancy_selection: true
  analysis_set_id_generated_by_task_c: false
  analysis_set_id_owned_by_task_b: true
  data_dependent_selection_owned_by_task_a_training_boundary: true
  all_nonraw_omission_rates_not_first_round_predictors: true
  rt_cv_empirical_minimum_n_gate: false
  rt_level_choice_not_frozen_here: true
  commission_dprime_joint_retention_not_frozen_here: false
  dprime_not_added_to_raw_omission_plus_commission: true
  main_reference_dimensions: [rt_level, rt_variability, rt_trend, omission, error_control]
