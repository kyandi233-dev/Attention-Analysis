pipeline:
  name: attention-analysis-nir-pupil-validation
  version: 4.0.0
  schema_version: 5
  purpose: "pupil-only formal validation and Figure01-10 report package from completed 11_analysis_tables"

paths:
  analysis_tables_root: "@path:nir_analysis_tables_root"
  output_root: "@path:nir_pipeline_validation_root"
  stimulus_visual_table: "@path:stimulus_visual_properties"

cohort:
  canonical_session_count: 116
  canonical_analysis_group_count: 61
  participant_group_size_policy: any_positive_integer
  availability_subset_topology_is_descriptive: true

source_contract:
  required_stage: "11_analysis_tables"
  require_session_manifest: true
  require_session_completion: true
  required_signal_semantics: "pupil_geometry_only"
  direct_read_production_nir: false
  direct_read_10_analysis_ready: false
  pir_formal_use_allowed: false
  oar_formal_use_allowed: false
  iris_fraction_role: "segmentation_qc_only"

analysis:
  main_track: "binocular_primary"
  robustness_tracks:
    - "binocular_primary"
    - "left_primary"
    - "right_primary"
    - "binocular_strict"
    - "left_strict"
    - "right_strict"
  feature_families:
    tonic:
      - pupil_median
      - pupil_mean
    variability:
      - pupil_mad
      - pupil_iqr
      - pupil_sd
      - pupil_p10
      - pupil_p90
    derivative:
      - pupil_slope_per_sec
      - pupil_diff_mad
      - pupil_diff_rate_mad_per_sec
    phasic:
      baseline_window: pre_200ms
      response_window: post_200_1150ms
      feature: phasic_pupil_delta
  prediction:
    outer_folds: 5
    group_key: analysis_group_token
    targets:
      - go_omission_target
      - nogo_commission_target
    majority_baseline_required: true
    balanced_accuracy_required: true
    roc_auc_required_when_estimable: true
    pr_auc_required_when_estimable: true

visual_covariates:
  enabled_when_table_exists: true
  current_trial_visual_allowed_for_pre_stimulus: false
  previous_trial_visual_allowed: true
  temporal_tolerance_ms: 0
  failure_state_required: true

figures:
  required_names:
    - Figure01
    - Figure02
    - Figure03
    - Figure04
    - Figure05
    - Figure06
    - Figure07
    - Figure08
    - Figure09
    - Figure10
  formats:
    - png
    - pdf
  dpi: 220

provenance:
  require_clean_code_checkout: true
  fixed_commit_fallback_allowed: false
  unresolved_commit_behavior: fail_closed
  record_config_digest: true
  record_source_stage_manifest_hashes: true

scientific_boundary:
  validation_and_report_packaging: true
  scientific_inference_authorized_by_code_alone: false
  measurement_validity_claim_authorized_by_code_alone: false
  allow_window_selection_from_current_effects: false
  allow_significance_driven_qc_thresholds: false
  failed_models_must_be_written_as_not_estimable: true
