pipeline:
  name: attention-analysis-nir-pipeline-validation
  version: 3
  schema_version: 4
  purpose: "validation-only comprehensive downstream smoke tests plus publication-grade Figure 1-10 suite using completed 11_analysis_tables and read-only 10_analysis_ready"

paths:
  analysis_ready_root: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v2/cohort-44-exploratory/10_analysis_ready"
  analysis_tables_root: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v2/cohort-44-exploratory/11_analysis_tables"
  output_root: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v2/cohort-44-exploratory/12_pipeline_validation"

  # Optional external covariates. Missing files do not abort validation; status is written to extension_readiness.json / publication_suite_summary.json.
  stimulus_visual_table: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v1/stimulus_visual_properties.csv"
  questionnaire_csv: null

subjects:
  # Empty means discover only subjects with validated 11_analysis_tables completion.
  include: []

analysis:
  main_track: "binocular_primary"
  track: "binocular_primary"  # backwards-compatible alias used by original diagnostic code
  robustness_tracks:
    - "binocular_primary"
    - "left_primary"
    - "right_primary"
    - "binocular_strict"
    - "left_strict"
    - "right_strict"

  # Fixed smoke-test windows. They are not selected from current outcome patterns.
  trial_display_window: "pre_5s"
  probe_model_window: "pre_20s"
  precursor_trial_window: "pre_5s"
  no_go_preceding_correct_go_trials: 5

  trial_state_windows:
    - "pre_1s"
    - "pre_3s"
    - "pre_5s"
    - "pre_10s"
    - "pre_20s"
    - "pre_30s"
    - "pre_60s"
  trial_event_windows:
    - "pre_200ms"
    - "post_200ms"
    - "post_200_1150ms"
  probe_windows:
    - "pre_10s"
    - "pre_20s"
    - "pre_30s"
    - "pre_60s"

  dynamic_pir_features:
    - "pir_median"
    - "pir_mean"
    - "pir_mad"
    - "pir_iqr"
    - "pir_sd"
    - "pir_p10"
    - "pir_p90"
    - "pir_slope_per_sec"
    - "pir_diff_mad"
    - "pir_diff_rate_mad_per_sec"

  # Whole-experiment Figure 1 / Block-transition Figure 2.
  global_display_block_gap_sec: 60
  global_summary_bin_sec: 10
  time_on_task_display_bin_sec: 30
  block_transition_window_sec: 120
  block_recovery_summary_sec: 60

  # True continuous event-aligned trajectories read from 10_analysis_ready.
  event_trajectory_start_sec: -60
  event_trajectory_end_sec: 2
  probe_trajectory_end_sec: 0
  event_trajectory_bin_sec: 1
  max_go_reference_events_per_subject_block: 60

  minimum_subjects_for_models: 3

  # Formal-statistics architecture flags. Validation may prepare these interfaces but must not select them from current effects.
  preserve_program_scoring: true
  preserve_omission_qc_subtypes: true
  preserve_probe_response_raw_codes: true
  use_raw_pir_for_between_person_characteristics: true
  use_centered_pir_for_within_person_effects: true
  visual_covariates_optional: true
  questionnaire_optional: true

figures:
  # Core/diagnostic outputs remain for engineering provenance.
  formats:
    - png
    - pdf
  dpi: 180

  # Manuscript-oriented Figure 1-10 outputs. PDF/SVG are vector; PNG/TIFF are high-resolution raster.
  publication_formats:
    - pdf
    - svg
    - png
    - tiff
  raster_dpi: 600
  manuscript_widths_cm:
    single: 8
    medium: 14
    full: 17
  font_family: "Arial"
  font_fallback: "DejaVu Sans"
  nominal_font_size_pt: 8
  panel_label_size_pt: 10
  fixed_canvas: true
  use_tight_bbox: false

scientific_boundary:
  validation_only: true
  nir_values_known_invalid: true
  allow_scientific_interpretation: false
  allow_window_selection_from_effects: false
  allow_significance_driven_qc_thresholds: false
  write_formal_statistics: false
  direct_read_production_nir: false
  direct_read_oar_from_production: false
  continuous_trajectories_may_read_analysis_ready_only: true
