# HISTORICAL CONFIG ONLY
# 该文件保留 2026-08-16 前后 NIR ROI / PuReST 候选链的历史配置与兼容路径。
# 当前正式 NIR 全量分析配置：runtime/nir-formal/config.yaml
# 不要把本文件用于当前 YOLO26n + RITnet 正式运行。

pipeline:
  name: attention-pipeline-v2-formal
  version: 0.1.0-candidate
  timezone: Asia/Shanghai
  status: blocked_roi_full_face_detectors_inapplicable

paths:
  formal_data_root: "E:/正式实验"  # 数据盘路径，新设备需改；其余模型路径均相对 v2 根，自包含可移植
  roi_selection_artifact_root: "artifacts/roi-selection-sub011-block1-2min"
  # 历史 ROI 定位候选权重（相对 v2 根，config.path_value 自动 resolve）
  face_landmarker_model: "models/historical/face_landmarker.task"
  yunet_model: "models/historical/yunet_2023mar.onnx"
  yolo_model: "models/historical/yolov8n-face.onnx"
  faceparts_model: "models/external/yolo-face-parts-detector/weights/yolov8n.pt"
  faceparts_model_small: "models/external/yolo-face-parts-detector/weights/yolov8s.pt"
  # 历史瞳孔分析候选算法权重
  ritnet_model: "models/external/ritnet/best_model.pkl"
  deepvog_weights: "models/external/deepvog/deepvog/model/DeepVOG_weights.h5"
  deepvog3d_weights: "models/external/deepvog/deepvog/model/DeepVOG3D_weights.h5"

runtimes:
  main_python: "D:/Code/python/python.exe"
  pypupilext_python: "D:/aaawork/07-竞赛/厚璨杯/venv-pupil/Scripts/python.exe"

nir:
  fps_nominal: 30
  roi_selection:
    subject: sub-011_
    block: 1
    duration_sec: 120
    calibration_sec: 30
    evaluation_sec: 90
    roi_size: [320, 160]
    corner_span_candidates: [0.50, 0.585, 0.67]
    manual_timepoints: 60
    comparison_sets: 12
    status: blocked_no_candidate_passed_identity_gate
    check:  # mediapipe ROI 完整检验（roi_check.py）
      subjects: [sub-011, sub-012, sub-013, sub-014, sub-015, sub-016, sub-9504]
      contact_frames: 12
      detection_stride: 500
      confidence_candidates: [0.5, 0.3]
      clahe: true
      roi_quality_frames: 6
      min_rate: 0.60
  sequence:
    px_min: 6
    px_max: 50
    pupil_min_mm_compat: 0.5
    openness_visible: 0.55
    openness_closed: 0.20
    outline_min: 0.5
    photometric_min: 0.02
    max_session_gap_ms: 200.0
    reset_after_quality_rejects: 3
    interpolation_max_ms: 200.0
    endpoint_diameter_tol: 0.20
    endpoint_center_tol_norm: 0.12
    center_span_px: 160.0

production:
  roi_backend: null
  parameters_frozen: false
  note: "60时点显示正式输入为双眼特写；MediaPipe、YuNet和当时YOLO-face正确双眼ROI均为0。该配置保留用于历史诊断，不代表当前 runtime/nir-formal 正式路线。"
