pipeline:
  name: focuswave-formal-multimodal-v2
  version: 2.0.0
  schema_version: 2
  focuswave_release: "v3.1.3"
  evidence_repo: "kyandi233-dev/FocusWave-Formal-Analysis"
  timezone: Asia/Shanghai

provenance:
  evidence_repo_path_env: ATTENTION_FORMAL_EVIDENCE_REPO
  require_clean_git_checkout: true
  fixed_commit_fallback_allowed: false
  unresolved_commit_behavior: fail_closed

path_contract:
  required_keys:
    - formal_raw_roots
    - cohort_manifest
    - repeat_registry
    - nir_source_manifest
    - nir_standardized_root
    - behavior_output_root
    - stimulus_visual_properties
    - rgb_output_root
    - mmwave_output_root
    - fusion_output_root

cohort:
  manifest_path_key: cohort_manifest
  session_column: session_id
  include_column: include
  repeat_group_column: repeat_participant_id
  require_repeat_group_for_inference: true
  require_session_unique: true
  expected_session_count: null
  expected_group_count: null

identity:
  statistical_unit: repeat_participant_id
  acquisition_unit: session_id
  participant_disjoint_folds: true
  forbid_session_as_independent_participant: true
  regenerate_folds_after_cohort_append: true

behavior:
  config: "configs/behavior_formal_v2.yaml"
  units: [trial, probe, block, session]
  outcomes:
    trial: [go_rt_ms, go_omission, nogo_commission]
    probe: [rt_median_ms, rt_cv, rt_slope, q1_raw, q2_ordered_vigilance]
    block_session: [commission_rate, omission_rate, dprime_loglinear, c, beta, rt_median_ms, rt_cv, rt_slope]
  policy:
    old_bbb_results_are_historical_only: true
    existing_12_probe_features_are_not_complete_outcomes: true
    signal_detection_requires_sufficient_opportunities: true
    no_formal_inference_before_repeat_grouping: true

nir:
  source_manifest_path_key: nir_source_manifest
  standardized_output_path_key: nir_standardized_root
  source_contract: fullclass-final
  canonical_contract: fullclass-final-pupil-only-v2
  join_clock: unix_ms
  join_time_unit: ms
  join_timezone: UTC
  formal_phases: [block1, block2]
  reject_historical_pir: true
  reject_fake_time_from_frame_idx: true
  normalize_eye_labels_in_memory_only: true
  preserve_eye_raw: true
  primary_metric_candidates:
    - pupil_equivalent_diameter
    - pupil_geom_mean_diameter
    - pupil_contour_area
    - pupil_ellipse_area
    - pupil_axis_a
    - pupil_axis_b
    - hard_pupil_fraction
    - soft_pupil_fraction
  optional_eye_opening_candidates:
    - ocular_aperture_ratio_median
    - ocular_aperture_ratio_p90
  ocular_aperture_policy:
    role: nir_eye_opening_candidate_qc
    preferred_summary: ocular_aperture_ratio_median
    not_ear: true
    not_blink_event: true
    not_perclos: true
    never_reconstruct_from_iris_fraction: true
    cross_validate_with_rgb_eyelid_or_blink: true
  forbidden_formal_metrics:
    - fullclass_pupil_to_iris_diameter_ratio
    - binocular_PIR
    - centered_PIR
    - iris_outer_diameter
    - iris_outer_ellipse
  qc_tracks:
    source: [source_frame_status, source_eye_status, ritnet_status]
    geometry: [pupil_found, pupil_fit_valid, pupil_component_count, pupil_largest_component_fraction, qc_pupil_fragmented]
    analysis_domain: [analysis_valid_pixel_count, analysis_valid_pixel_fraction, predicted_in_padding_fraction, touches_roi_edge]
    uncertainty: [soft_max_probability, soft_margin, soft_entropy]
    temporal: [frame_gap, time_gap_ms, temporal_reset, temporal_anomaly, diameter_delta, center_jump]
  qc_policy:
    ritnet_success_is_not_geometry_validity: true
    keep_missing_rejected_interpolated_separate: true
    artificial_padding_not_scientific_denominator: true
    do_not_auto_exclude_whole_session: true
  standardization_candidates: [raw, session_eye_baseline_subtracted, within_session_robust_z, event_local_baseline_subtracted]
  visual_confound_audit:
    enabled: true
    properties_path_key: stimulus_visual_properties
    current_stimulus: [relative_luminance, rms_contrast, stimulus_size, stimulus_code]
    previous_stimulus: [relative_luminance, rms_contrast, stimulus_size, stimulus_code]
    general_covariates: [time_on_task, block, eye, quality_coverage]
    note: "数字sRGB视觉属性，不作为物理cd/m²测量。"

mmwave:
  role: external_merge_ready_modality
  current_loadable_status_must_come_from_manifest: true
  hr_rr_separate: true
  no_external_ecg_rsp_validation_claim: true
  hrv_core_claim_allowed: false
  preserve_motion_and_qc: true
  known_code_gates: [summary_field_contract, finite_candidate_selection, formal_method_dependencies]
  missing_sessions_are_missing_not_zero: true

rgb:
  role: external_merge_ready_modality
  priority_features: [primary_face_coverage, valid_observation_time, eyelid_openness, blink_rate, blink_duration, blink_interval]
  secondary_families: [head_motion, pose, global_motion, action_units]
  remote_ppg_enabled: false
  blink_requires_event_validation: true
  perclos_requires_validated_closure_events: true

fusion:
  units: [trial, probe, block, session]
  key_contract:
    trial: [repeat_participant_id, session_id, block_id, trial_id]
    probe: [repeat_participant_id, session_id, block_id, probe_id, window_name]
    block: [repeat_participant_id, session_id, block_id]
    session: [repeat_participant_id, session_id]
  model_ladder: [design_baseline, behavior_context_baseline, single_modality, theory_supported_pairwise, full_multimodal]
  validation:
    participant_disjoint: true
    preprocessing_inside_training_folds: true
    common_cohort_paired_comparison: true
    report_coverage_alongside_performance: true
    no_missingness_identity_leakage: true
  inference:
    separate_within_between_person_effects: true
    explanation_and_prediction_separate: true
    do_not_average_pvalues_or_auc_across_batches: true
    refit_after_appending_compatible_sessions: true

analysis_policy:
  no_outcome_driven_window_selection: true
  no_significance_only_report_admission: true
  preserve_failed_and_blocked_results: true
  no_source_file_overwrite: true
  fail_on_schema_or_key_mismatch: true
