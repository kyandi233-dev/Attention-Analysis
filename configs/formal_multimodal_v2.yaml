pipeline:
  name: focuswave-formal-multimodal-v2
  version: 2.2.2
  schema_version: 4
  focuswave_release_provenance: "v3.1.3-v3.1.4_science_equivalent"
  evidence_repo: "kyandi233-dev/FocusWave-Formal-Analysis"
  evidence_branch: "codex/code-fix-ledger"
  timezone: Asia/Shanghai

provenance:
  evidence_repo_path_env: ATTENTION_FORMAL_EVIDENCE_REPO
  require_clean_git_checkout: true
  fixed_commit_fallback_allowed: false
  unresolved_commit_behavior: fail_closed
  every_active_stage_requires_manifest: true
  every_active_stage_records_config_digest: true
  every_active_stage_records_full_code_sha: true

path_contract:
  required_keys:
    - formal_raw_roots
    - cohort_manifest
    - repeat_registry
    - questionnaire_derived_data
    - behavior_output_root
    - nir_analysis_ready_source_manifest_json
    - nir_analysis_ready_root
    - nir_analysis_tables_root
    - stimulus_visual_properties
    - rgb_raw_output_root
    - rgb_analysis_ready_root
    - rgb_analysis_tables_root

cohort:
  manifest_path_key: cohort_manifest
  session_column: session_id
  include_column: include
  repeat_group_column: repeat_participant_id
  legacy_identity_status_column: identity_status
  allowed_legacy_identity_statuses: [temporary_confirmed, confirmed, verified, validated, governed]
  require_session_unique: true
  expected_session_count: 44
  expected_group_count: 38
  expected_double_session_repeat_groups: 6
  note: "44 sessions / 38 current anonymous participant groups / 6 double-session repeat groups are distinct counting axes and current-cohort facts, not permanent study totals."

identity:
  canonical_statistical_unit: participant_group_id
  verified_source_field: participant_key
  legacy_manifest_input: repeat_participant_id
  nir_storage_compatibility_alias: analysis_group_token
  acquisition_unit: session_id
  questionnaire_missing_does_not_drop_session: true
  participant_disjoint_folds: true
  forbid_session_as_independent_participant: true
  unresolved_participant_inference_status: not_estimable
  regenerate_identity_and_folds_after_cohort_append: true
  prediction_preprocessing_inside_training_fold: true

behavior:
  status: active_authoritative
  config: "configs/behavior_formal_v2.yaml"
  entrypoint: "scripts/sart_formal_analysis.py"
  formal_pipeline: behavior-science-v3
  units: [trial, probe, cycle, block, session, participant_group]
  outcomes:
    trial: [go_omission, nogo_commission, correct_go_rt_ms]
    probe:
      - go_correct_rt_mean_ms
      - go_correct_rt_median_ms
      - go_correct_rt_sd_ms
      - go_correct_rt_mad_ms
      - go_correct_rt_iqr_ms
      - go_correct_rt_cv
      - go_correct_rt_theilsen_slope_ms_per_s
      - raw_go_omission_rate
      - clean_go_omission_rate
      - timing_ambiguous_go_omission_rate
      - commission_rate
      - dprime_loglinear
      - criterion_c
      - beta
      - q1_nominal_4class
      - q2_ordinal_4level
  policy:
    old_bbb_results_are_historical_only: true
    go_omission_and_nogo_commission_separate_denominators: true
    primary_probe_one_row_per_event: true
    probe_window_sensitivity_seconds: [10, 20, 30]
    probe_sensitivity_rows_not_independent_primary_samples: true
    q1_model: nominal_four_class_reference_1_participant_clustered
    q2_model: ordinal_four_level_participant_clustered
    b1_b2: session_pair_then_participant_cluster_bootstrap
    cycle: nested_block_session_participant_with_block_by_cycle_model
    error_trajectory: separate_error_events_with_participant_centered_rt
    two_session_reliability_claim: not_estimable
    failed_models_must_be_written: true

nir:
  status: active_authoritative_staged_pupil_only
  authoritative_entrypoint: "scripts/nir_formal_pipeline.py"
  analysis_ready_config: "configs/nir_analysis_ready.yaml"
  formal_tables_config: "configs/nir_formal_analysis.yaml"
  analysis_ready_source_manifest_path_key: nir_analysis_ready_source_manifest_json
  analysis_ready_output_path_key: nir_analysis_ready_root
  analysis_tables_output_path_key: nir_analysis_tables_root
  production_source_contract: fullclass-final
  canonical_adapter_contract: fullclass-final-pupil-only-v2
  stage_chain:
    - 10_analysis_ready
    - 11_analysis_tables
    - 12_pipeline_validation
  validation_config: "configs/nir_pipeline_validation.yaml"
  join_clock: unix_ms
  join_time_unit: ms
  join_timezone: UTC
  formal_phases: [block1, block2]
  reject_historical_pir: true
  reject_fake_time_from_frame_idx: true
  direct_validation_read_from_production: false
  normalize_eye_labels_in_memory_only: true
  preserve_eye_raw: true
  preserve_ocular_aperture_qc: true
  ocular_aperture_policy:
    source_fields:
      - fullclass_ocular_aperture_ratio_median
      - fullclass_ocular_aperture_ratio_p90
    role: nir_eye_opening_candidate_qc
    preferred_summary: fullclass_ocular_aperture_ratio_median
    derivation: visible_ocular_mask_height_over_width
    not_ear: true
    not_blink_event: true
    not_perclos: true
    never_reconstruct_from_iris_fraction: true
    do_not_reconstruct_from_iris_fraction: true
    cross_validate_with_rgb_eyelid_or_blink: true
  iris_fraction_role: segmentation_qc_only
  forbidden_formal_metrics:
    - fullclass_pupil_to_iris_diameter_ratio
    - binocular_PIR
    - centered_PIR
    - iris_outer_diameter
    - iris_outer_ellipse
  qc_tracks:
    source: [source_frame_status, source_eye_status, ritnet_status]
    geometry: [pupil_found, pupil_fit_valid, pupil_component_count, pupil_largest_component_fraction, qc_pupil_fragmented]
    analysis_domain: [analysis_valid_pixel_count, analysis_valid_pixel_fraction, pupil_predicted_in_padding_pixels, touches_roi_edge]
    uncertainty: [soft_max_probability, soft_margin, soft_entropy]
    temporal: [frame_gap, time_gap_ms, temporal_reset, temporal_anomaly, diameter_delta, center_jump]
  qc_policy:
    ritnet_success_is_not_geometry_validity: true
    keep_missing_rejected_interpolated_separate: true
    artificial_padding_not_scientific_denominator: true
    do_not_auto_exclude_whole_session: true
  standardization_candidates: [raw, session_eye_baseline_subtracted, within_session_robust_z, event_local_baseline_subtracted]
  repeated_session_baseline_policy: "session-eye baselines remain session-specific; repeat sessions do not share baselines"
  visual_confound_audit:
    enabled: true
    properties_path_key: stimulus_visual_properties
    current_stimulus: [relative_luminance, rms_contrast, stimulus_size, stimulus_code]
    previous_stimulus: [relative_luminance, rms_contrast, stimulus_size, stimulus_code]
    current_visual_for_pre_stimulus_window: forbidden
    previous_visual_for_pre_stimulus_window: allowed_if_strictly_previous
    temporal_tolerance_ms: 0
    require_time_direction_and_match_status: true
    note: "数字 sRGB 视觉属性，不作为物理 cd/m² 测量。"
  legacy_csv_adapter:
    status: legacy_compatibility_only
    active_in_formal_pipeline: false
    command: "scripts/formal_multimodal_analysis.py nir-adapt"
    source_manifest_path_key: nir_source_manifest
    standardized_output_path_key: nir_standardized_root
    may_authorize_formal_statistics: false
    may_replace_staged_analysis_ready: false

rgb:
  status: active_authoritative_lightweight_qc
  config: "configs/rgb_formal.yaml"
  entrypoint: "scripts/rgb_formal_downstream.py"
  active_components: [motion_qc, pose_confirmation_direction, algorithm_defined_blink_candidates]
  deferred_components: [perclos, action_units, emotion, rppg, complex_prediction, multimodal_fusion]
  blink_event_status: algorithm_defined_candidate_not_manually_validated_truth
  motion_pose_blink_combined_risk_score_allowed: false

mmwave:
  authority_repository: "greenboo26/focuswave-multimodal-attention-analysis"
  role: external_producer_then_future_formal_ingest
  do_not_duplicate_producer_engine_here: true
  structural_missing_policy: "explicit_missing_not_zero_not_success"
  no_external_ecg_rsp_validation_claim: true
  hrv_core_claim_allowed: false

fusion:
  status: disabled_deferred
  active_production_merge_allowed: false
  reason: "single-modality analysis and QC must be frozen first"
  # Compatibility metadata for the historical merge scaffold. These keys retain
  # the old repeat_participant_id alias only because merge.py is deferred and not
  # production-authoritative; future production fusion must use participant_group_id.
  units: [trial, probe, cycle, block, session, participant_group]
  key_contract:
    trial: [repeat_participant_id, session_id, block_id, trial_id]
    probe: [repeat_participant_id, session_id, block_id, probe_id, window_name]
    cycle: [repeat_participant_id, session_id, block_id, cycle_bin]
    block: [repeat_participant_id, session_id, block_id]
    session: [repeat_participant_id, session_id]
    participant_group: [repeat_participant_id]
  canonical_future_participant_key: participant_group_id
  row_locator_policy: "session/event keys locate rows; participant_group_id is grouping metadata and an identity-consistency gate"
  historical_merge_scaffold:
    module: "src/attention_pipeline/formal_analysis/merge.py"
    command: "scripts/formal_multimodal_analysis.py merge-audit"
    status: legacy_deferred_audit_only
    current_keys_use_repeat_participant_id_alias: true
    production_ready: false
  future_validation_requirements:
    participant_disjoint: true
    preprocessing_inside_training_folds: true
    common_cohort_paired_comparison: true
    report_coverage_alongside_performance: true
    no_missingness_identity_leakage: true
    explanation_and_prediction_separate: true

ledger_release_gates:
  behavior_science_v3_contract_required: true
  nir_pupil_stage_contract_required: true
  cross_modal_identity_parity_test_required: true
  model_failure_tables_required: true
  real_data_full_run_authorized_by_config_alone: false

analysis_policy:
  no_outcome_driven_window_selection: true
  no_significance_only_report_admission: true
  preserve_failed_and_blocked_results: true
  no_source_file_overwrite: true
  fail_on_schema_or_key_mismatch: true
  no_real_full_run_before_supervised_release: true
  historical_compatibility_code_must_not_be_described_as_current_authority: true
