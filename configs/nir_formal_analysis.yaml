pipeline:
  name: attention-analysis-nir-formal-analysis-tables-pupil-only
  version: 2.5.1
  schema_version: 7
  signal_semantics: pupil_geometry_only
  timezone: Asia/Shanghai

paths:
  # NIR-linked Behavior trials must use the same authoritative portable Behavior config/runtime.
  behavior_config: "configs/behavior_formal_v2.yaml"
  analysis_ready_root: "@path:nir_analysis_ready_root"
  output_root: "@path:nir_analysis_tables_root"
  stimulus_visual_table: "@path:stimulus_visual_properties"

sessions:
  include: []

identity:
  cohort_manifest_path_key: cohort_manifest
  repeat_registry_path_key: repeat_registry
  questionnaire_path_key: questionnaire_derived_data
  cohort_session_column: session_id
  cohort_include_column: include
  legacy_repeat_group_column: repeat_participant_id
  legacy_identity_status_column: identity_status
  allowed_legacy_identity_statuses: [temporary_confirmed, confirmed, verified, validated, governed]
  formal_cluster_key: participant_group_id
  analysis_group_token_role: nir_compatibility_alias_only
  selected_sessions_must_be_subset_of_governed_cohort: true
  analysis_group_token_partition_must_match_participant_group: true
  participant_key_must_never_be_inferred_from_session_number: true

baseline_semantics:
  session_centering_reference_name: session_eye_centering_reference
  session_centering_is_resting_baseline: false
  event_local_baseline_name: pre_event_local_baseline
  event_local_baseline_start_ms: -200
  event_local_baseline_end_ms: 0
  resting_task_start_interval_source: master_timeline_baseline_start_to_baseline_stop
  resting_task_start_interval_protocol_confirmed: true
  resting_task_start_reference_status: audit_only_pending_observability_threshold_freeze
  video_head_fixed_180s_may_substitute_for_timeline: false

resting_observability:
  start_event: baseline_start
  stop_event: baseline_stop
  expected_duration_sec: 180
  duration_tolerance_sec: 30
  max_contiguous_gap_sec: 0.25
  min_primary_valid_fraction: null
  min_longest_primary_valid_sec: null
  not_observed_may_be_called_eyes_closed: false
  role: exploratory_only_not_forced_into_main_models

figures:
  internal_title_allowed: false
  caption_is_external: true
  in_image_language: English
  font_family: Times New Roman
  legend_frame: false
  require_metric_scale_coverage_audit: true
  require_all_pupil_candidates: true
  require_window_feature_families: true
  require_event_response_feature_families: true

behavior_qc:
  carryover_candidate_ms: 200

tracks:
  primary: binocular_primary
  include:
    - name: binocular_primary
      family: primary_reference
      value_column: binocular_pupil
      valid_column: null
      source_mode_column: binocular_source_mode
    - name: left_primary
      family: eye_preserved
      value_column: left_centered_pupil
      valid_column: left_pupil_valid_primary
      source_mode_column: null
    - name: right_primary
      family: eye_preserved
      value_column: right_centered_pupil
      valid_column: right_pupil_valid_primary
      source_mode_column: null
    - name: binocular_strict
      family: strict_sensitivity
      value_column: binocular_strict_pupil
      valid_column: null
      source_mode_column: binocular_strict_source_mode
    - name: left_strict
      family: strict_sensitivity
      value_column: left_strict_centered_pupil
      valid_column: left_pupil_valid_strict
      source_mode_column: null
    - name: right_strict
      family: strict_sensitivity
      value_column: right_strict_centered_pupil
      valid_column: right_pupil_valid_strict
      source_mode_column: null

candidate_metrics:
  source_stage: 10_analysis_ready_candidate_sidecar
  final_endpoint_freeze: frozen_20260831_primary_plus_sensitivity
  primary_metrics:
    - pupil_geom_mean_diameter
    - hard_pupil_fraction
  sensitivity_metrics:
    - pupil_equivalent_diameter
    - pupil_axis_a
    - pupil_axis_b
    - pupil_contour_area
    - pupil_ellipse_area
    - soft_pupil_fraction
  primary_probe_window: pre_30s
  primary_event_baseline_window: pre_200ms
  outcome_pvalue_selection_allowed: false
  compare_coverage: true
  compare_within_between_structure: true
  compare_redundancy: true
  repeat_direction_requires_verified_visit_order: true
  iris_fraction_candidate_allowed: false
  pir_candidate_allowed: false
  iris_geometry_candidate_allowed: false
  ocular_aperture_qc_allowed: true
  ocular_aperture_formal_endpoint: false
  ocular_aperture_interpretation: producer_visible_ocular_mask_qc_not_ear_not_blink_not_perclos

windows:
  trial:
    - {name: pre_200ms, family: event_baseline, start_offset_ms: -200, end_offset_ms: 0}
    - {name: post_200ms, family: event_response, start_offset_ms: 0, end_offset_ms: 200}
    - {name: post_200_1150ms, family: event_response, start_offset_ms: 200, end_offset_ms: 1150}
    - {name: pre_1s, family: state, start_offset_ms: -1000, end_offset_ms: 0}
    - {name: pre_3s, family: state, start_offset_ms: -3000, end_offset_ms: 0}
    - {name: pre_5s, family: state, start_offset_ms: -5000, end_offset_ms: 0}
    - {name: pre_10s, family: state, start_offset_ms: -10000, end_offset_ms: 0}
    - {name: pre_20s, family: state, start_offset_ms: -20000, end_offset_ms: 0}
    - {name: pre_30s, family: state, start_offset_ms: -30000, end_offset_ms: 0}
    - {name: pre_60s, family: state, start_offset_ms: -60000, end_offset_ms: 0}
  probe:
    - {name: pre_10s, family: probe_state, start_offset_ms: -10000, end_offset_ms: 0}
    - {name: pre_20s, family: probe_state, start_offset_ms: -20000, end_offset_ms: 0}
    - {name: pre_30s, family: probe_state, start_offset_ms: -30000, end_offset_ms: 0}
    - {name: pre_60s, family: probe_state, start_offset_ms: -60000, end_offset_ms: 0}

time_on_task:
  bin_sec: 1.0

probe_contract:
  strict_pre_event: true
  require_trial_num_before_anchor: true
  require_trial_onset_before_probe: true
  anchoring_probe_trial_allowed: false
  aggregate_actual_visual_exposure: true
  future_visual_information_allowed: false

analysis_policy:
  analysis_ready_is_only_nir_input: true
  production_nir_read_directly: false
  preserve_left_right_eyes: true
  preserve_repeat_group_token: true
  participant_partition_identity_audit_required: true
  overlap_audit_required: true
  session_autocorrelation_control_required: true
  choose_window_from_outcome: false
  auto_exclude_sessions: false
  auto_exclude_eyes: false
  run_formal_statistics: false
  session_centering_reference_must_not_be_reported_as_resting_baseline: true
  resting_reference_requires_timeline_events: true
  resting_reference_requires_prefrozen_observability_thresholds: true
  resting_not_observed_must_not_be_called_eyes_closed: true
  inference_and_prediction_must_remain_separate: true
  machine_absolute_paths_allowed_in_science_config: false
  behavior_runtime_must_use_shared_portable_path_registry: true
