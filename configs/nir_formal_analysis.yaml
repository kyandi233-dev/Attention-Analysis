pipeline:
  name: attention-analysis-nir-formal-analysis-tables-pupil-only
  version: 2.1.0
  schema_version: 3
  signal_semantics: pupil_geometry_only
  timezone: Asia/Shanghai

paths:
  behavior_config: "configs/behavior_formal.yaml"
  analysis_ready_root: "../Attention-Analysis-local/nir-behavior-v2/10_analysis_ready"
  output_root: "../Attention-Analysis-local/nir-behavior-v2/11_analysis_tables"
  # Existing reconstructed SART visual-property table. The strict pre-probe
  # exposure builder uses only stimuli that occurred before the anchoring probe.
  stimulus_visual_table: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v1/stimulus_visual_properties.csv"

sessions:
  # Empty = discover completed pupil-only session folders in 10_analysis_ready.
  include: []

behavior_qc:
  # Candidate flag only; does not become a final outcome-tuned exclusion threshold.
  carryover_candidate_ms: 200

tracks:
  # Legacy reference signal for the existing 11_analysis_tables interface.
  # This is NOT a scientific declaration that geom-mean diameter is the final
  # winning pupil metric; candidate sidecars are validated separately first.
  primary: binocular_primary
  include:
    - name: binocular_primary
      family: primary_reference
      value_column: binocular_pupil
      valid_column: null
      source_mode_column: binocular_source_mode

    - name: left_primary
      family: eye_preserved
      value_column: left_centered_pupil
      valid_column: left_pupil_valid_primary
      source_mode_column: null

    - name: right_primary
      family: eye_preserved
      value_column: right_centered_pupil
      valid_column: right_pupil_valid_primary
      source_mode_column: null

    - name: binocular_strict
      family: strict_sensitivity
      value_column: binocular_strict_pupil
      valid_column: null
      source_mode_column: binocular_strict_source_mode

    - name: left_strict
      family: strict_sensitivity
      value_column: left_strict_centered_pupil
      valid_column: left_pupil_valid_strict
      source_mode_column: null

    - name: right_strict
      family: strict_sensitivity
      value_column: right_strict_centered_pupil
      valid_column: right_pupil_valid_strict
      source_mode_column: null

candidate_metrics:
  source_stage: 10_analysis_ready_candidate_sidecar
  final_endpoint_freeze: pending_real_data_scientific_review
  outcome_pvalue_selection_allowed: false
  compare_coverage: true
  compare_within_between_structure: true
  compare_redundancy: true
  repeat_direction_requires_verified_visit_order: true
  iris_fraction_candidate_allowed: false
  pir_oar_allowed: false

windows:
  trial:
    # Event windows are retained so phasic pupil change can be defined against an
    # explicit pre-event baseline rather than mixing state and response semantics.
    - name: pre_200ms
      family: event_baseline
      start_offset_ms: -200
      end_offset_ms: 0
    - name: post_200ms
      family: event_response
      start_offset_ms: 0
      end_offset_ms: 200
    - name: post_200_1150ms
      family: event_response
      start_offset_ms: 200
      end_offset_ms: 1150
    # Long windows are state/tonic descriptors. They are intentionally preserved
    # but their overlap is audited and they are not IID trial-level inferential units.
    - name: pre_1s
      family: state
      start_offset_ms: -1000
      end_offset_ms: 0
    - name: pre_3s
      family: state
      start_offset_ms: -3000
      end_offset_ms: 0
    - name: pre_5s
      family: state
      start_offset_ms: -5000
      end_offset_ms: 0
    - name: pre_10s
      family: state
      start_offset_ms: -10000
      end_offset_ms: 0
    - name: pre_20s
      family: state
      start_offset_ms: -20000
      end_offset_ms: 0
    - name: pre_30s
      family: state
      start_offset_ms: -30000
      end_offset_ms: 0
    - name: pre_60s
      family: state
      start_offset_ms: -60000
      end_offset_ms: 0

  probe:
    - name: pre_10s
      family: probe_state
      start_offset_ms: -10000
      end_offset_ms: 0
    - name: pre_20s
      family: probe_state
      start_offset_ms: -20000
      end_offset_ms: 0
    - name: pre_30s
      family: probe_state
      start_offset_ms: -30000
      end_offset_ms: 0
    - name: pre_60s
      family: probe_state
      start_offset_ms: -60000
      end_offset_ms: 0

time_on_task:
  bin_sec: 1.0

probe_contract:
  strict_pre_event: true
  require_trial_num_before_anchor: true
  require_trial_onset_before_probe: true
  anchoring_probe_trial_allowed: false
  aggregate_actual_visual_exposure: true
  future_visual_information_allowed: false

analysis_policy:
  analysis_ready_is_only_nir_input: true
  production_nir_read_directly: false
  preserve_left_right_eyes: true
  preserve_repeat_group_token: true
  overlap_audit_required: true
  session_autocorrelation_control_required: true
  choose_window_from_outcome: false
  auto_exclude_sessions: false
  auto_exclude_eyes: false
  run_formal_statistics: false
