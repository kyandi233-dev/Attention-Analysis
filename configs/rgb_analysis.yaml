pipeline:
  name: attention-analysis-rgb
  status: development
  branch: rgb-dev
  base_backend: amd-directml

focuswave:
  repository: kyandi233-dev/FocusWave
  branch: formaltest
  accepted_formal_versions:
    - "v3.1.3"
    - "v3.1.4"
  formal_structure: "BB"
  expected_blocks: 2
  baseline_duration_sec: 180
  # FocusWave formaltest SART trial duration: 0.25 s stimulus + 0.9 s mask.
  trial_duration_ms: 1150

data:
  roots:
    - "E:/正式实验"
    - "F:/正式实验"
    - "E:/Data"
    - "F:/Data"
  min_subject_number: 31
  rgb_video_pattern: "sub-*_/rgb/*_rgb.avi"
  rgb_timestamp_suffix: "_rgb_timestamps.csv"
  behavior_dir: "beh"
  master_timeline: "master_timeline.csv"
  exclude:
    sub-9504: "not part of the formal analysis cohort"

analysis_window:
  start: "baseline_stop_minus_duration"
  end: "last_formal_block_stop"
  preserve_transition_phases: true

# Hard development rule: preserve expensive model outputs before filtering.
# See docs/040-rgb/044-RGB输出Schema与信息保留原则.md before adding any model stage.
retention:
  schema_version: "rgb-dev-0.1"
  preserve_supported_raw_model_outputs: true
  preserve_frame_identity_and_timestamps: true
  preserve_qc_flags_before_filtering: true
  drop_invalid_rows_before_raw_save: false
  write_manifest_for_formal_subject_outputs: true

face:
  enabled: true
  status: benchmark
  candidates:
    - pyfeat
    - libreface2
  selected_backend: null
  target_outputs:
    - action_units
    - expression
    - gaze
    - head_pose
  optional_outputs:
    - valence_arousal
    - face_landmarks
    - blendshapes
  inference_fps: null
  directml_onnx_candidate: true

pose:
  enabled: true
  backend: mediapipe_tasks_pose_landmarker
  status: pilot
  schema_version: "rgb-pose-landmarks-v0.1"
  # Fast formal-video validation: enough temporal density for posture/upper-body QC
  # while avoiding an unnecessary 30 fps model pass before the pipeline is frozen.
  inference_fps: 10
  model_path: "_test/pose_landmarker_lite.task"
  model_url: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
  num_poses: 2
  min_pose_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  output_segmentation_masks: false
  normalize_motion_by_body_scale: true
  # Do not request full segmentation masks in this first pilot: complete normalized
  # and world landmarks are retained and can define a reproducible subject ROI.
  target_outputs:
    - normalized_landmarks_33
    - world_landmarks_33
    - visibility
    - presence
    - pose_bbox
    - wrist_motion
    - elbow_motion
    - shoulder_motion
    - upper_body_motion
    - trunk_lean
    - posture_variability

motion:
  enabled: true
  backend: opencv_frame_difference
  status: global_pilot_validated
  schema_version: "rgb-motion-raw-v0.1"
  process_full_fps: true
  gap_reset_ms: 100
  irregular_dt_multiple: 1.5
  pixel_diff_threshold: 15
  target_outputs:
    - global_motion_energy
    - body_motion_energy
  optical_flow_fallback: false

qc:
  min_face_valid_rate: null
  min_pose_valid_rate: null
  timestamp_gap_warning_ms: 100

output:
  root: "D:/_AttentionData/Beijing-RGB"
  test_dir: "_test"
  raw_format: parquet
  analysis_format: parquet
  summary_format: csv
  subject_file_prefix: true
