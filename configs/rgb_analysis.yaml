pipeline:
  name: attention-analysis-rgb
  status: development
  branch: rgb-dev
  base_backend: amd-directml

focuswave:
  repository: kyandi233-dev/FocusWave
  branch: formaltest
  accepted_formal_versions:
    - "v3.1.3"
    - "v3.1.4"
  formal_structure: "BB"
  expected_blocks: 2
  baseline_duration_sec: 180
  # FocusWave formaltest SART trial duration: 0.25 s stimulus + 0.9 s mask.
  trial_duration_ms: 1150

data:
  roots:
    - "E:/正式实验"
    - "F:/正式实验"
    - "E:/Data"
    - "F:/Data"
  min_subject_number: 31
  rgb_video_pattern: "sub-*_/rgb/*_rgb.avi"
  rgb_timestamp_suffix: "_rgb_timestamps.csv"
  behavior_dir: "beh"
  master_timeline: "master_timeline.csv"
  exclude:
    sub-9504: "not part of the formal analysis cohort"

analysis_window:
  start: "baseline_stop_minus_duration"
  end: "last_formal_block_stop"
  preserve_transition_phases: true

retention:
  schema_version: "rgb-dev-0.1"
  preserve_supported_raw_model_outputs: true
  preserve_frame_identity_and_timestamps: true
  preserve_qc_flags_before_filtering: true
  drop_invalid_rows_before_raw_save: false
  write_manifest_for_formal_subject_outputs: true

face:
  enabled: true
  status: benchmark
  candidates:
    - pyfeat
    - libreface2
  selected_backend: null
  target_outputs:
    - action_units
    - expression
    - gaze
    - head_pose
  optional_outputs:
    - valence_arousal
    - face_landmarks
    - blendshapes
  inference_fps: null
  directml_onnx_candidate: true
  benchmark:
    # One deterministic shared image set is extracted once and reused by every
    # candidate so coverage, speed and outputs are compared on identical frames.
    jpeg_quality: 95
    phase_samples:
      baseline: 50
      instructions: 25
      practice: 35
      transition: 15
      block1: 90
      interblock_transition: 45
      block2: 90
  continuous_benchmark:
    # Second-round Face validation: one shared contiguous mid-Block1 window.
    # 30 s x 10 fps ~= 300 frames; sampling is driven by real RGB timestamps.
    phase: block1
    duration_sec: 30
    inference_fps: 10
    jpeg_quality: 95

pose:
  enabled: true
  backend: mediapipe_pose
  status: pilot_validated_10fps
  schema_version: "rgb-pose-landmarks-v0.1"
  model_variant: lite
  model_path: "_test/pose_landmarker_lite.task"
  model_url: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
  # sub-031 benchmark: 10 fps full formal span completed in ~7.15 min at
  # ~36.1 inference/s with 100% pose-frame coverage, so retain 10 fps.
  inference_fps: 10.0
  num_poses: 2
  min_pose_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  output_segmentation_masks: false
  decode_sampled_frames_only: true
  normalize_motion_by_body_scale: true
  formal_landmark_scope: upper_body
  upper_body_landmarks:
    - nose
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
  optional_trunk_landmarks:
    - left_hip
    - right_hip
  # Development gates for derived motion only. Raw pose landmarks are never
  # dropped. A landmark must pass all gates before it contributes to motion.
  feature_min_visibility: 0.5
  feature_min_presence: 0.5
  feature_require_in_frame: true
  # Pose is sampled at 10 fps (~100 ms). Reset derived velocity across gaps
  # longer than three nominal sample intervals rather than bridging outages.
  feature_gap_reset_ms: 300
  target_outputs:
    - wrist_motion
    - elbow_motion
    - shoulder_motion
    - upper_body_motion
    - trunk_lean
    - posture_variability

motion:
  enabled: true
  backend: opencv_frame_difference
  status: pilot_validated_global
  schema_version: "rgb-motion-raw-v0.1"
  process_full_fps: true
  gap_reset_ms: 100
  irregular_dt_multiple: 1.5
  pixel_diff_threshold: 15
  target_outputs:
    - global_motion_energy
    - body_motion_energy
  optical_flow_fallback: false

qc:
  min_face_valid_rate: null
  min_pose_valid_rate: null
  timestamp_gap_warning_ms: 100

output:
  root: "D:/_AttentionData/Beijing-RGB"
  test_dir: "_test"
  raw_format: parquet
  analysis_format: parquet
  summary_format: csv
  subject_file_prefix: true
