pipeline:
  name: attention-analysis-rgb
  status: development
  branch: rgb-dev
  base_backend: amd-directml

focuswave:
  repository: kyandi233-dev/FocusWave
  branch: formaltest
  accepted_formal_versions:
    - "v3.1.3"
    - "v3.1.4"
  formal_structure: "BB"
  expected_blocks: 2
  baseline_duration_sec: 180
  # FocusWave formaltest SART trial duration: 0.25 s stimulus + 0.9 s mask.
  trial_duration_ms: 1150

data:
  roots:
    - "E:/正式实验"
    - "F:/正式实验"
    - "E:/Data"
    - "F:/Data"
  min_subject_number: 31
  rgb_video_pattern: "sub-*_/rgb/*_rgb.avi"
  rgb_timestamp_suffix: "_rgb_timestamps.csv"
  behavior_dir: "beh"
  master_timeline: "master_timeline.csv"
  # Keep excluded subjects visible in audit/provenance, but do not pass them to
  # later formal RGB analysis stages. sub-033 is intentionally NOT excluded:
  # its AVI and timestamp rows remain one-to-one, but acquisition contains gaps
  # that must be marked missing during downstream analysis.
  exclude:
    sub-9504: "not part of the formal analysis cohort"

analysis_window:
  # Process one continuous RGB timeline instead of physically splitting videos.
  start: "baseline_stop_minus_duration"
  end: "last_formal_block_stop"
  preserve_transition_phases: true

# Hard development rule: preserve expensive model outputs before filtering.
# See docs/040-rgb/044-RGB输出Schema与信息保留原则.md before adding any model stage.
retention:
  schema_version: "rgb-dev-0.1"
  preserve_supported_raw_model_outputs: true
  preserve_frame_identity_and_timestamps: true
  preserve_qc_flags_before_filtering: true
  drop_invalid_rows_before_raw_save: false
  write_manifest_for_formal_subject_outputs: true

face:
  enabled: true
  status: benchmark
  candidates:
    - pyfeat
    - libreface2
  selected_backend: null
  target_outputs:
    - action_units
    - expression
    - gaze
    - head_pose
  optional_outputs:
    - valence_arousal
    - face_landmarks
    - blendshapes
  inference_fps: null
  directml_onnx_candidate: true

pose:
  enabled: true
  backend: mediapipe_pose
  status: planned_default
  inference_fps: null
  normalize_motion_by_body_scale: true
  target_outputs:
    - wrist_motion
    - elbow_motion
    - shoulder_motion
    - upper_body_motion
    - trunk_lean
    - posture_variability

motion:
  enabled: true
  backend: opencv_frame_difference
  status: pilot
  schema_version: "rgb-motion-raw-v0.1"
  process_full_fps: true
  # Development parameters, not frozen scientific exclusion thresholds.
  # Raw dt/capture-gap fields are retained so these can be changed later.
  gap_reset_ms: 100
  irregular_dt_multiple: 1.5
  pixel_diff_threshold: 15
  target_outputs:
    - global_motion_energy
    - body_motion_energy
  optical_flow_fallback: false

qc:
  min_face_valid_rate: null
  min_pose_valid_rate: null
  # Development warning only; not yet a formal exclusion threshold. Every gap
  # above this value is written to rgb_timestamp_gaps.csv with full provenance.
  timestamp_gap_warning_ms: 100

output:
  # RGB analysis results live outside the repository, alongside Beijing-NIR.
  root: "D:/_AttentionData/Beijing-RGB"
  test_dir: "_test"
  raw_format: parquet
  analysis_format: parquet
  summary_format: csv
  # Subject output files are always prefixed with subject id, e.g.
  # sub-031_motion_raw.parquet, even inside sub-031/.
  subject_file_prefix: true
