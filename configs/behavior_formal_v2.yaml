pipeline:
  name: attention-analysis-behavior-formal-v3
  version: 3.2.0
  schema_version: 6
  # v3.1.3/v3.1.4 share the same final BB scientific task structure; the
  # internal application version is provenance, not a required report label.
  focuswave_science_structure: "formaltest_BB_v3.1.0_plus"
  focuswave_release_provenance: "v3.1.3-v3.1.4_science_equivalent"
  timezone: Asia/Shanghai
  random_seed: 20260829

data:
  roots_path_key: formal_raw_roots
  behavior_dir: "beh"

cohort:
  # This is the CURRENT analysis cohort, not the total formal-study sample.
  # The cohort manifest alone decides which sessions are in this execution queue.
  # Questionnaire rows never create/delete cohort sessions.
  manifest_path_key: cohort_manifest
  session_column: session_id
  include_column: include
  repeat_group_column: repeat_participant_id
  identity_registry_path_key: repeat_registry
  questionnaire_path_key: questionnaire_derived_data
  expected_session_count: 44
  expected_group_count: 38
  expected_double_session_repeat_groups: 6
  current_queue_is_full_study_sample: false

paths:
  output_root:
    path_key: behavior_output_root

formal:
  expected_blocks: 2
  blocks:
    - number: 1
      condition: "B"
    - number: 2
      condition: "B"

validation:
  expected_trials_per_block: null
  expected_nogo_per_block: null
  expected_probes_per_block: null
  require_cross_subject_count_consistency: true
  require_probe_position_consistency: false
  timestamp_tolerance_ms: 25

behavior:
  cycle_bins: 6
  rt_cv_min_n: 20
  rt_slope_min_n: 5
  rt_valid_min_ms: 100
  rt_valid_max_ms: null
  # Motor-timing ambiguity screen; this is a prespecified sensitivity/QC rule,
  # not an outcome-tuned exclusion threshold.
  carryover_candidate_ms: 200
  rt_qc_ms:
    very_early: 100
    early: 150
    long: 1000
    beyond_nominal: 1150
  primary_probe_window_seconds: 30
  probe_windows_seconds: [10, 20, 30]
  probe_preceding_go_trials: 8
  omission_endpoints:
    raw: raw_go_omission_rate
    clean: clean_go_omission_rate
    timing_ambiguous: timing_ambiguous_go_omission_rate
    shared_denominator: valid_go_opportunities
    partition_contract: "raw_go_omission_rate = clean_go_omission_rate + timing_ambiguous_go_omission_rate"
    clean_interpretation: "no detected prestimulus/carry-over motor-timing ambiguity; not proven attentional lapse"
    finer_prestimulus_carryover_subtypes_role: qc_descriptive_only
    late_gt_1150_role: timing_diagnostic_only

stats:
  bootstrap_iterations: 20000
  seed: 20260829
  q1_reference_category: 1
  minimum_model_rows: 24
  minimum_participant_groups: 6
  prediction_folds: 5
  sdt_min_go_opportunities: 4
  sdt_min_nogo_opportunities: 2
  main_metrics:
    - go_correct_rt_mean_ms
    - go_correct_rt_median_ms
    - go_correct_rt_sd_ms
    - go_correct_rt_mad_ms
    - go_correct_rt_iqr_ms
    - go_correct_rt_cv
    - go_correct_rt_theilsen_slope_ms_per_s
    - raw_go_omission_rate
    - clean_go_omission_rate
    - timing_ambiguous_go_omission_rate
    - commission_rate
    - dprime_loglinear
    - criterion_c
    - beta
  compatibility_aliases:
    omission_rate: raw_go_omission_rate
    omission_no_detected_motor_timing_ambiguity_rate: clean_go_omission_rate
    omission_motor_timing_ambiguous_rate: timing_ambiguous_go_omission_rate

execution:
  record_step_timing: true
  execution_steps_csv_required: true
  execution_manifest_json_required: true
  skipped_optional_step_marks_partial_run: true
  structural_steps_cannot_be_skipped: true
  subset_subjects_write_isolated_smoke_output: true

figures:
  internal_title_allowed: false
  caption_is_external: true
  require_metric_scale_coverage_audit: true
  require_chinese_axes_legends: true
  require_participant_and_session_n_where_relevant: true

analysis_policy:
  require_repeat_participant_id_for_inference: true
  require_participant_group_identity_source: true
  cohort_manifest_defines_session_membership: true
  current_44_38_6_is_analysis_subset_not_study_total: true
  questionnaire_must_left_join_sessions: true
  questionnaire_missing_does_not_drop_session: true
  preserve_raw_omission_scoring: true
  raw_clean_timing_ambiguous_omission_are_prespecified_formal_endpoints: true
  clean_plus_timing_ambiguous_must_equal_raw_omission: true
  finer_prestimulus_carryover_subtypes_are_qc_only: true
  late_response_candidate_is_timing_diagnostic_only: true
  allow_legacy_session_level_stats: false
  old_bbb_results_are_historical_only: true
  no_hardcoded_cohort_size: false
  cohort_counts_are_governed_config_not_inferred_participant_count: true
  go_omission_and_nogo_commission_are_separate_outcomes: true
  q1_is_nominal_four_class: true
  q2_is_ordinal_four_level_clustered: true
  probe_anchor_trial_excluded: true
  probe_window_sensitivity_does_not_increase_primary_n: true
  failed_models_must_be_written: true
  participant_disjoint_prediction: true
  inference_and_prediction_outputs_are_separate: true
