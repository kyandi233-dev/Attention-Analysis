schema_version: 1
method_authority: FocusWave-Formal-Analysis/1.16.4-1.16.10
# This is a measurement-review catalog, not an automatically approved predictor
# registry. Empty candidates intentionally await the final producer/schema freeze.
# Finite values do not certify source/QC/estimability. No Q1-based selection here.
dimensions:
  - scientific_feature_id: behavior_rt_level
    modality: behavior
    feature_type: reaction_time
    report_name: 反应时水平
    primary_candidates: [go_correct_rt_mean_ms, go_correct_rt_median_ms]
    comparison_pairs: [[go_correct_rt_mean_ms, go_correct_rt_median_ms]]
    descriptive_candidates: []
    required_for_modality: true
    required_devices: []
    raw_source: behavior_formal/probe_primary_30s
    preprocessing_dependencies: [behavior_authoritative_probe_time]
  - scientific_feature_id: behavior_rt_variability
    modality: behavior
    feature_type: reaction_time_variability
    report_name: 反应时波动
    primary_candidates: [go_correct_rt_cv]
    comparison_pairs: [[go_correct_rt_sd_ms, go_correct_rt_mad_ms], [go_correct_rt_sd_ms, go_correct_rt_iqr_ms]]
    descriptive_candidates: [go_correct_rt_sd_ms, go_correct_rt_mad_ms, go_correct_rt_iqr_ms]
    required_for_modality: true
    required_devices: []
    raw_source: behavior_formal/probe_primary_30s
    preprocessing_dependencies: [behavior_authoritative_probe_time]
  - scientific_feature_id: behavior_rt_trend
    modality: behavior
    feature_type: reaction_time_trend
    report_name: 反应时变化趋势
