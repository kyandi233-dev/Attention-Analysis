# LEGACY / PROTOTYPE ALIGNMENT CONFIG.
# It keeps the old sub-031 safety gate and machine-specific roots for historical
# reproducibility. Current formal cross-machine analysis must use
# configs/formal_multimodal_v2.yaml + an external paths registry/source manifest.

pipeline:
  name: attention-analysis-nir-behavior-alignment
  version: 0.1.2
  schema_version: 2
  focuswave_release: "v3.1.3"
  timezone: Asia/Shanghai

paths:
  behavior_config: "configs/behavior_formal.yaml"
  nir_source_roots:
    - "D:/_AttentionData/Beijing-NIR/amd-directml"
    - "runtime/nir-formal/outputs/amd-directml/formal"
    - "outputs/amd-directml/formal"
  output_root: "D:/_AttentionData/Beijing-NIR/analysis/nir-behavior-v1"

subjects:
  # Prototype safety gate. Retained only for historical reproduction.
  include:
    - "sub-031"

behavior_qc:
  carryover_candidate_ms: 200

windows:
  trial:
    - name: "pre_200ms"
      family: "event"
      start_offset_ms: -200
      end_offset_ms: 0
    - name: "post_200ms"
      family: "event"
      start_offset_ms: 0
      end_offset_ms: 200
    - name: "post_200_1150ms"
      family: "event"
      start_offset_ms: 200
      end_offset_ms: 1150
    - name: "pre_1s"
      family: "state"
      start_offset_ms: -1000
      end_offset_ms: 0
    - name: "pre_3s"
      family: "state"
      start_offset_ms: -3000
      end_offset_ms: 0
    - name: "pre_5s"
      family: "state"
      start_offset_ms: -5000
      end_offset_ms: 0
    - name: "pre_10s"
      family: "state"
      start_offset_ms: -10000
      end_offset_ms: 0
    - name: "pre_20s"
      family: "state"
      start_offset_ms: -20000
      end_offset_ms: 0
    - name: "pre_30s"
      family: "state"
      start_offset_ms: -30000
      end_offset_ms: 0
    - name: "pre_60s"
      family: "state"
      start_offset_ms: -60000
      end_offset_ms: 0
  probe:
    - name: "pre_10s"
      family: "probe_state"
      start_offset_ms: -10000
      end_offset_ms: 0
    - name: "pre_20s"
      family: "probe_state"
      start_offset_ms: -20000
      end_offset_ms: 0
    - name: "pre_30s"
      family: "probe_state"
      start_offset_ms: -30000
      end_offset_ms: 0
    - name: "pre_60s"
      family: "probe_state"
      start_offset_ms: -60000
      end_offset_ms: 0

diagnostics:
  max_line_gap_sec: 2.5

visual_covariates:
  properties_csv: null

analysis_policy:
  fuse_eyes: false
  roi_clipped_is_exclusion_gate: false
  define_nir_blink_or_perclos: false
  raw_pupil_pixels_as_primary: false
  separate_boundary_truncation_from_internal_missingness: true
  oar_available_fraction_is_quality_gate: false
