[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-analysis"
version = "1.0.1"
description = "Auditable NIR and behavioral attention-analysis pipeline for the Houcan Cup project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
