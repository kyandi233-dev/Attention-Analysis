[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-analysis"
version = "0.2.0"
description = "Auditable NIR and behavioral analysis pipeline for the Houcan Cup project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
nir = ["mediapipe>=0.10"]
test = ["pytest>=8.0"]

[project.scripts]
attention-analysis = "attention_pipeline.cli:main"
attention-pipeline = "attention_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
