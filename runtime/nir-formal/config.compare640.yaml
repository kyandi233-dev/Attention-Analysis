package:
  name: nir-formal
  version: 0.2.0-candidate.1
  purpose: AMD DirectML fast RITnet-512 candidate runtime; diagnostic runner retained
data:
  roots:
  - E:/正式实验
  - F:/正式实验
  - E:/Data
  - F:/Data
  subject_pattern: sub-*_/nir/*_nir.avi
  default_duration_sec: 60
models:
  yolo: models/nir-eye-yolo26n-best.onnx
  ritnet: models/ritnet-b16-fp32.onnx
  ritnet_external_data: models/ritnet-b16-fp32.onnx.data
  ritnet_reference: models/ritnet-b16-fp32.onnx
  ritnet_reference_external_data: models/ritnet-b16-fp32.onnx.data
yolo:
  confidence: 0.4
  imgsz: 640
  nms_iou: 0.7
  max_det: 20
tracking:
  method: none
  redetect_interval: 10
  center_jump_width_fraction: 0.5
roi:
  width: 320
  height: 160
  expand_horizontal_each_side: 0.3
  expand_vertical_each_side: 0.45
ritnet:
  enabled: true
  input_width: 640
  input_height: 400
  batch_size: 16
  precision: fp32
  pupil_confidence_min: null
formal:
  focuswave_release: v3.1.3
  min_subject_number: 31
  phases:
  - baseline
  - instructions
  - practice
  - block1
  - block2
  baseline_duration_sec: 180
  practice_trial_duration_ms: 1150
  expected_formal_blocks: 2
batch:
  subjects:
    include: []
    exclude:
    - sub-9504
  device: '0'
  continue_on_error: true
  skip_completed: true
  output_root: outputs/amd-directml/ritnet512/formal
output:
  root: outputs/amd-directml/ritnet512
  overlay_stride: 30
  save_rois: false
