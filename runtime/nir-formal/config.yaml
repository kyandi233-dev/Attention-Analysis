package:
  name: nir-formal
  version: 1.0.1
  purpose: GPU formal NIR analysis runtime; diagnostic runner retained

data:
  # 正式原始数据位于两个逻辑目录 `正式实验` 与 `Data`。
  # 两块外接存储设备的 Windows 盘符可能在 E:/ 与 F:/ 之间变化，
  # 因此同时声明四个候选根；batch discovery 会忽略不存在的路径。
  roots:
    - "E:/正式实验"
    - "F:/正式实验"
    - "E:/Data"
    - "F:/Data"
  subject_pattern: "sub-*_/nir/*_nir.avi"
  default_duration_sec: 60

models:
  yolo: "models/nir-eye-yolo26n-best.pt"
  ritnet: "models/ritnet-best_model.pkl"
  yolo_onnx: "models/nir-eye-yolo26n-best.onnx"
  ritnet_onnx: "models/ritnet-b16-fp32.onnx"
  ritnet_onnx_external_data: "models/ritnet-b16-fp32.onnx.data"

inference:
  # Preserve the frozen CUDA/PyTorch baseline by default. Select ort-cuda
  # explicitly only after parity and speed validation on the target NVIDIA GPU.
  backend: pytorch-cuda
  # Validated YOLO scheduling batch for the formal NVIDIA run.
  yolo_batch_size: 8

yolo:
  confidence: 0.40
  imgsz: 640
  nms_iou: 0.70
  max_det: 20

# Tracking remains available for diagnostic reproduction, but formal analysis
# defaults to per-frame YOLO because KCF/CSRT were slower on the target RTX host.
tracking:
  method: none
  redetect_interval: 10
  center_jump_width_fraction: 0.50

roi:
  # Stable analysis coordinate system used for pupil ellipse outputs.
  width: 320
  height: 160
  expand_horizontal_each_side: 0.30
  expand_vertical_each_side: 0.45

ritnet:
  enabled: true
  input_width: 640
  input_height: 400
  batch_size: 16
  precision: fp32
  pupil_confidence_min: null

formal:
  focuswave_release: "v3.1.3"
  min_subject_number: 31
  phases:
    - baseline
    - instructions
    - practice
    - block1
    - block2
  baseline_duration_sec: 180
  practice_trial_duration_ms: 1150
  expected_formal_blocks: 2

# Multi-subject formal batch runner settings.
# `include: []` means: analyze every discovered subject >= min_subject_number,
# after applying `exclude`. To run only selected people, list them explicitly,
# e.g. ["sub-031", "sub-033", "sub-056"].
batch:
  subjects:
    include: []
    exclude:
      - "sub-9504"
  device: "0"
  continue_on_error: true
  skip_completed: true
  output_root: "outputs/formal"

output:
  root: "outputs"
  overlay_stride: 3000
  save_rois: false
