package:
  name: nir-formal
  version: 0.2.0
  purpose: NVIDIA CUDA formal NIR analysis runtime; shared v8 science with CUDA execution

data:
  roots:
    - "J:/Data"
    - "E:/正式实验"
    - "F:/正式实验"
    - "E:/Data"
    - "F:/Data"
  subject_pattern: "sub-*_/nir/*_nir.avi"
  default_duration_sec: 60

models:
  yolo: "models/nir-eye-yolo26n-best.onnx"
  yolo_formal: "models/nir-eye-yolo26n-best-b8.onnx"
  ritnet: "models/ritnet-b16-fp32.onnx"
  ritnet_external_data: "models/ritnet-b16-fp32.onnx.data"
  ritnet_reference: "models/ritnet-b16-fp32.onnx"
  ritnet_reference_external_data: "models/ritnet-b16-fp32.onnx.data"
  ritnet_fullclass_final: "models/ritnet-b16-fp32-uncertainty.onnx"
  ritnet_fullclass_final_external_data: "models/ritnet-b16-fp32-uncertainty.onnx.data"

yolo:
  confidence: 0.40
  imgsz: 640
  nms_iou: 0.70
  max_det: 20
  batch_size: 8

tracking:
  method: none
  redetect_interval: 10
  center_jump_width_fraction: 0.50

roi:
  width: 320
  height: 160
  expand_horizontal_each_side: 0.30
  expand_vertical_each_side: 0.45

ritnet:
  enabled: true
  input_width: 640
  input_height: 400
  batch_size: 16
  precision: fp32
  pupil_confidence_min: null

fullclass:
  output_dirname: "ritnet-fullclass-final"
  roi:
    target_width: 640
    target_height: 400
    aspect_ratio: 1.6
    expand_horizontal_each_side: 0.30
    expand_vertical_each_side: 0.45
    padding_mode: "replicate"
  qc_interval_sec: 30
  # Fixed timeline anchors remain mandatory. Anomaly examples are bounded to a
  # human-reviewable sample rather than filling the output directory.
  qc_anomaly_max_per_reason: 5
  qc_image_max_count: 80
  qc_pixel_evidence_max_eyes: 16
  qc_artifact_budget_bytes: 268435456
  final_output_limit_bytes: 1073741824

  # Throughput/recovery scheduling only; these do not change scientific values.
  summary_workers: 2
  max_pending_summaries: 2
  checkpoint_rows: 128
  progress_every_batches: 100

formal:
  focuswave_release: "v3.1.3"
  min_subject_number: 31
  phases:
    - baseline
    - instructions
    - practice
    - block1
    - block2
  baseline_duration_sec: 180
  practice_trial_duration_ms: 1150
  expected_formal_blocks: 2

batch:
  subjects:
    include: []
    exclude:
      - "sub-9504"
  device: "0"
  continue_on_error: true
  skip_completed: true
  output_root: "outputs/nvidia-cuda/formal"

output:
  root: "outputs/nvidia-cuda"
  overlay_stride: 3000
  save_rois: false
