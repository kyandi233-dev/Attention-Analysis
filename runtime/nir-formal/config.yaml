package:
  name: nir-formal
  version: 1.1.0
  purpose: NVIDIA CUDA formal NIR runtime with final <=1 GiB RITnet full-class evidence path

data:
  roots:
    - "J:/Data"
  subject_pattern: "sub-*_/nir/*_nir.avi"
  default_duration_sec: 60

models:
  yolo: "models/nir-eye-yolo26n-best.pt"
  ritnet: "models/ritnet-best_model.pkl"
  yolo_onnx: "models/nir-eye-yolo26n-best.onnx"
  ritnet_onnx: "models/ritnet-b16-fp32.onnx"
  ritnet_onnx_external_data: "models/ritnet-b16-fp32.onnx.data"
  # Final full-class ONNX uses the same frozen RITnet weights and five-output graph
  # as the AMD path. NVIDIA executes it through CUDAExecutionProvider.
  ritnet_fullclass_final: "models/ritnet-b16-fp32-uncertainty.onnx"
  ritnet_fullclass_final_external_data: "models/ritnet-b16-fp32-uncertainty.onnx.data"

inference:
  backend: pytorch-cuda
  yolo_batch_size: 8

yolo:
  confidence: 0.40
  imgsz: 640
  nms_iou: 0.70
  max_det: 20
  batch_size: 8

tracking:
  method: none
  redetect_interval: 10
  center_jump_width_fraction: 0.50

# Historical formal ROI. Final full-class uses the independent frozen contract below.
roi:
  width: 320
  height: 160
  expand_horizontal_each_side: 0.30
  expand_vertical_each_side: 0.45

ritnet:
  enabled: true
  input_width: 640
  input_height: 400
  batch_size: 16
  precision: fp32
  pupil_confidence_min: null

fullclass:
  output_dirname: "ritnet-fullclass-final"
  roi:
    target_width: 640
    target_height: 400
    aspect_ratio: 1.6
    expand_horizontal_each_side: 0.30
    expand_vertical_each_side: 0.45
    padding_mode: "replicate"
  qc_interval_sec: 30
  qc_boundary_band_px: 5
  low_max_probability_threshold: null
  qc_anomaly_max_per_reason: 20
  qc_image_max_count: 200
  qc_pixel_evidence_max_eyes: 16
  qc_artifact_budget_bytes: 268435456
  final_output_limit_bytes: 1073741824

formal:
  focuswave_release: "v3.1.3"
  min_subject_number: 31
  phases:
    - baseline
    - instructions
    - practice
    - block1
    - block2
  baseline_duration_sec: 180
  practice_trial_duration_ms: 1150
  expected_formal_blocks: 2

batch:
  subjects:
    include: []
    exclude:
      - "sub-9504"
  device: "0"
  continue_on_error: true
  skip_completed: true
  output_root: "D:/Project/厚粲杯/11_数据/01_Attention-Analysis_nvidia-cuda_formal_NIR"

output:
  root: "D:/Project/厚粲杯/11_数据/01_Attention-Analysis_nvidia-cuda_formal_NIR"
  overlay_stride: 3000
  save_rois: false
