name: Task A supervised-learning CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  supervised-task-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Compile Task A and vertical-integration modules
        run: |
          python -m py_compile \
            scripts/supervised_learning_analysis.py \
            scripts/materialize_supervised_input.py \
            scripts/validate_supervised_prediction_archive.py \
            src/attention_pipeline/supervised_learning/__init__.py \
            src/attention_pipeline/supervised_learning/task.py \
            src/attention_pipeline/supervised_learning/preprocessing.py \
            src/attention_pipeline/supervised_learning/feature_schemes.py \
            src/attention_pipeline/supervised_learning/feature_registry.py \
            src/attention_pipeline/supervised_learning/comparison_provenance.py \
            src/attention_pipeline/supervised_learning/models.py \
            src/attention_pipeline/supervised_learning/runner.py \
            src/attention_pipeline/supervised_learning/evaluation.py \
            src/attention_pipeline/supervised_learning/trajectory.py \
            src/attention_pipeline/supervised_learning/reporting.py \
            src/attention_pipeline/supervised_learning/outcome_scope.py \
            src/attention_pipeline/supervised_learning/entrypoint.py \
            src/attention_pipeline/multimodal_formal/quality_admission.py \
            src/attention_pipeline/multimodal_formal/analysis_sets.py \
            src/attention_pipeline/multimodal_formal/supervised_input.py \
            src/attention_pipeline/multimodal_formal/prediction_archive.py \
            src/attention_pipeline/multimodal_formal/probe_key_authority.py \
            src/attention_pipeline/nir_formal_analysis/supervised_probe_table.py

      - name: Run Task A and vertical-integration contract tests
        run: |
          python -m pytest -q \
            tests/test_supervised_learning_task.py \
            tests/test_supervised_learning_preprocessing.py \
            tests/test_supervised_learning_feature_schemes.py \
            tests/test_supervised_learning_feature_registry.py \
            tests/test_supervised_learning_registry_serialization.py \
            tests/test_supervised_learning_config_authority.py \
            tests/test_supervised_learning_models.py \
            tests/test_supervised_learning_runner.py \
            tests/test_supervised_learning_contract_review.py \
            tests/test_supervised_learning_evaluation.py \
            tests/test_supervised_learning_trajectory.py \
            tests/test_supervised_learning_reporting.py \
            tests/test_supervised_learning_modality_reporting.py \
            tests/test_supervised_learning_entrypoint.py \
            tests/test_supervised_outcome_scope.py \
            tests/test_task_b_malformed_feature_values.py \
            tests/test_supervised_vertical_integration.py \
            tests/test_supervised_registry_task_b_identity.py \
            tests/test_supervised_input_cli.py \
            tests/test_supervised_prediction_archive_cli.py \
            tests/test_nir_supervised_probe_table.py
