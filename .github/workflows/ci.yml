name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - nvidia-cuda
      - amd-DirectML
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run repository tests
        run: pytest -q

      - name: Run formal NIR runtime tests
        run: python -m pytest runtime/nir-formal/tests -q
