name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - nvidia-cuda
      - amd-DirectML
      - codex/formal-analysis-v2-portable
  pull_request:

jobs:
  formal-adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Compile formal analysis modules
        run: |
          python -m py_compile \
            scripts/setup_formal_environment.py \
            scripts/formal_multimodal_analysis.py \
            scripts/sart_formal_analysis.py \
            scripts/nir_formal_pipeline.py \
            scripts/nir_build_analysis_tables.py \
            scripts/nir_validate_pupil_formal.py \
            src/attention_pipeline/formal_analysis/execution_control.py \
            src/attention_pipeline/formal_analysis/join_keys.py \
            src/attention_pipeline/formal_analysis/provenance.py \
            src/attention_pipeline/formal_analysis/merge.py \
            src/attention_pipeline/formal_analysis/nir_adapter.py \
            src/attention_pipeline/formal_analysis/identity_questionnaire.py \
            src/attention_pipeline/behavior_formal/behavior_error_taxonomy.py \
            src/attention_pipeline/behavior_formal/candidate_validation.py \
            src/attention_pipeline/behavior_formal/omission_candidate_validation.py \
            src/attention_pipeline/behavior_formal/omission_endpoints.py \
            src/attention_pipeline/behavior_formal/omission_probe_models.py \
            src/attention_pipeline/behavior_formal/science_v3.py \
            src/attention_pipeline/behavior_formal/science_v3_extensions.py \
            src/attention_pipeline/behavior_formal/science_v3_figures.py \
            src/attention_pipeline/behavior_formal/reporting_contract.py \
            src/attention_pipeline/nir_pupil_only/join.py \
            src/attention_pipeline/nir_pupil_only/contract.py \
            src/attention_pipeline/nir_analysis_ready/pupil_only.py \
            src/attention_pipeline/nir_formal_analysis/pupil_tables.py \
            src/attention_pipeline/nir_formal_analysis/baseline_contract.py \
            src/attention_pipeline/nir_formal_analysis/resting_observability.py \
            src/attention_pipeline/nir_formal_analysis/probe_contract.py \
            src/attention_pipeline/nir_formal_analysis/event_response.py \
            src/attention_pipeline/nir_formal_analysis/adjustment_audit.py \
            src/attention_pipeline/nir_pipeline_validation/scientific_contract.py \
            src/attention_pipeline/nir_pipeline_validation/pupil_validation.py \
            src/attention_pipeline/nir_pipeline_validation/pupil_figures.py \
            src/attention_pipeline/rgb_formal/pipeline.py \
            src/attention_pipeline/rgb_formal/runner.py \
            src/attention_pipeline/rgb_formal/science.py \
            src/attention_pipeline/rgb_formal/figures.py

      - name: Run formal adapter and behavior contracts
        run: |
          python -m pytest -q \
            tests/test_setup_formal_environment.py \
            tests/test_formal_execution_control.py \
            tests/test_formal_analysis_v2.py \
            tests/test_formal_fusion_units.py \
            tests/test_formal_identity_questionnaire.py \
            tests/test_behavior_science_v3_contract.py \
            tests/test_behavior_science_v3_extensions.py \
            tests/test_behavior_reporting_contract.py \
            tests/test_behavior_candidate_validation.py \
            tests/test_behavior_error_taxonomy.py \
            tests/test_behavior_omission_candidate_validation.py \
            tests/test_behavior_omission_endpoints.py \
            tests/test_behavior_omission_probe_models.py \
            tests/test_behavior_visit_sensitivity.py \
            tests/test_behavior_figure_contract_complete.py

      - name: Run formal NIR contracts
        run: |
          python -m pytest -q \
            tests/test_nir_adapter_blockers.py \
            tests/test_nir_pupil_validation_contract.py \
            tests/test_nir_formal_failure_gates.py \
            tests/test_nir_temporal_brightness_gate.py \
            tests/test_nir_pupil_candidate_layer.py \
            tests/test_nir_dynamic_features.py \
            tests/test_nir_probe_contract.py \
            tests/test_nir_reference_adjusted_models.py \
            tests/test_nir_event_response.py \
            tests/test_nir_adjustment_audit.py \
            tests/test_nir_baseline_contract.py \
            tests/test_nir_resting_observability.py

      - name: Run staged NIR regression tests
        run: |
          python -m pytest -q \
            tests/test_nir_analysis_ready.py \
            tests/test_nir_formal_analysis.py \
            tests/test_nir_pipeline_validation.py \
            tests/test_nir_publication_suite.py

  current-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run current repository baseline tests
        run: |
          pytest -q \
            tests/test_behavior_formal_bb.py \
            tests/test_current_data_roots.py \
            tests/test_formal_nir.py \
            tests/test_io.py \
            tests/test_nir.py \
            tests/test_portable_nir_gpu_package.py

      - name: Run formal NIR runtime tests
        run: python -m pytest runtime/nir-formal/tests -q
