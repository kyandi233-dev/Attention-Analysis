name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - nvidia-cuda
      - amd-DirectML
  pull_request:

jobs:
  current-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pupil-only adapter tests
        run: python -m pytest tests/test_nir_pupil_only_adapter.py -q

      - name: Run NIR rejected-v2 contract regressions
        run: python -m pytest tests/test_nir_formal_v2_rejected_rework.py -q

      - name: Compile NIR rework modules
        run: |
          python -m py_compile \
            src/attention_pipeline/nir_formal_analysis/rejected_rework.py \
            src/attention_pipeline/nir_pipeline_validation/report_admission.py

      - name: Run current repository baseline tests
        run: |
          pytest -q \
            tests/test_behavior_formal_bb.py \
            tests/test_current_data_roots.py \
            tests/test_formal_nir.py \
            tests/test_io.py \
            tests/test_nir.py \
            tests/test_portable_nir_gpu_package.py

      - name: Run formal NIR runtime tests
        run: python -m pytest runtime/nir-formal/tests -q
