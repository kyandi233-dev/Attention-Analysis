name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - nvidia-cuda
      - amd-DirectML
  pull_request:

jobs:
  current-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run formal analysis contract tests
        run: |
          python -m pytest -q \
            tests/test_formal_analysis_v2.py \
            tests/test_nir_adapter_blockers.py

      - name: Run current repository baseline tests
        run: |
          pytest -q \
            tests/test_behavior_formal_bb.py \
            tests/test_current_data_roots.py \
            tests/test_formal_nir.py \
            tests/test_io.py \
            tests/test_nir.py \
            tests/test_portable_nir_gpu_package.py

      - name: Run formal NIR runtime tests
        run: python -m pytest runtime/nir-formal/tests -q
