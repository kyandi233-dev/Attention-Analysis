name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - nvidia-cuda
      - amd-DirectML
  pull_request:

jobs:
  formal-adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Compile formal analysis modules
        run: |
          python -m py_compile \
            scripts/formal_multimodal_analysis.py \
            scripts/sart_formal_analysis.py \
            scripts/nir_formal_pipeline.py \
            scripts/nir_build_analysis_tables.py \
            scripts/nir_validate_pupil_formal.py \
            src/attention_pipeline/formal_analysis/join_keys.py \
            src/attention_pipeline/formal_analysis/provenance.py \
            src/attention_pipeline/formal_analysis/merge.py \
            src/attention_pipeline/formal_analysis/nir_adapter.py \
            src/attention_pipeline/nir_pupil_only/join.py \
            src/attention_pipeline/nir_pupil_only/contract.py \
            src/attention_pipeline/nir_analysis_ready/pupil_only.py \
            src/attention_pipeline/nir_formal_analysis/pupil_tables.py \
            src/attention_pipeline/nir_pipeline_validation/scientific_contract.py \
            src/attention_pipeline/nir_pipeline_validation/pupil_validation.py \
            src/attention_pipeline/nir_pipeline_validation/pupil_figures.py \
            src/attention_pipeline/behavior_formal/science_v3.py \
            src/attention_pipeline/behavior_formal/science_v3_extensions.py \
            src/attention_pipeline/behavior_formal/science_v3_figures.py

      - name: Run formal adapter and ledger contract tests
        run: |
          python -m pytest -q \
            tests/test_formal_analysis_v2.py \
            tests/test_nir_adapter_blockers.py \
            tests/test_behavior_science_v3_contract.py \
            tests/test_behavior_science_v3_extensions.py \
            tests/test_nir_pupil_validation_contract.py \
            tests/test_nir_formal_failure_gates.py \
            tests/test_nir_temporal_brightness_gate.py

      - name: Run staged NIR regression tests
        run: |
          python -m pytest -q \
            tests/test_nir_analysis_ready.py \
            tests/test_nir_formal_analysis.py \
            tests/test_nir_pipeline_validation.py \
            tests/test_nir_publication_suite.py

  current-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run current repository baseline tests
        run: |
          pytest -q \
            tests/test_behavior_formal_bb.py \
            tests/test_current_data_roots.py \
            tests/test_formal_nir.py \
            tests/test_io.py \
            tests/test_nir.py \
            tests/test_portable_nir_gpu_package.py

      - name: Run formal NIR runtime tests
        run: python -m pytest runtime/nir-formal/tests -q
